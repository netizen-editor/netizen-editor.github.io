name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 0 */2 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health_check
        run: |
          set -e
          echo "Ping at $(date -u)"
          CODE=$(curl -s -o /tmp/r.json -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/health_check?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "HTTP $CODE"
          cat /tmp/r.json
          [ "$CODE" = "200" ] || { echo "::error::Ping failed: $CODE"; exit 1; }
          echo "✅ OK"
