<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Netizen Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto:wght@400;700&family=Open+Sans:wght@400;700&family=Lato:wght@400;700&family=Montserrat:wght@400;700&family=Poppins:wght@400;700&family=Be+Vietnam+Pro:wght@400;600;700&family=Nunito:wght@400;700&family=Raleway:wght@400;700&family=Playfair+Display:wght@400;700&family=Oswald:wght@400;700&family=Bebas+Neue&family=Dancing+Script:wght@400;700&family=Lobster&display=swap" rel="stylesheet">
<!-- Thư viện Fabric.js quan trọng bắt buộc phải có -->
<script src="https://cdn.jsdelivr.net/npm/fabric@5.3.0/dist/fabric.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: #f8f9fa; color: #1f2937; height: 100vh; overflow: hidden; }
  button { cursor: pointer; font-family: inherit; border: none; background: none; }
  input, select { font-family: inherit; }
  .hidden { display: none !important; }
  .screen { height: 100vh; overflow: hidden; }

  /* Loading / Auth */
  #screen-loading, #screen-auth {
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
  }
  #screen-loading { color: #fff; font-size: 18px; }
  .auth-card { background: #fff; padding: 40px; border-radius: 14px; width: 400px;
    box-shadow: 0 20px 60px rgba(0,0,0,.25); }
  .auth-card h1 { font-size: 24px; color: #4f46e5; margin-bottom: 6px; text-align: center; }
  .auth-card .sub { color: #6b7280; font-size: 13px; text-align: center; margin-bottom: 24px; }
  .auth-card label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px; }
  .auth-card input { width: 100%; padding: 11px 14px; border: 1px solid #d1d5db;
    border-radius: 8px; font-size: 14px; margin-bottom: 14px; }
  .auth-card button { width: 100%; padding: 11px; background: #4f46e5; color: #fff;
    border-radius: 8px; font-weight: 600; font-size: 14px; }
  .auth-card button:hover { background: #4338ca; }
  .auth-card button:disabled { opacity: .5; cursor: default; }
  #auth-msg { font-size: 13px; text-align: center; margin-top: 14px; min-height: 20px; color: #059669; }
  #auth-msg.error { color: #dc2626; }

  /* Dashboard */
  #screen-dashboard { overflow-y: auto; }
  #screen-dashboard header { display: flex; justify-content: space-between; align-items: center;
    padding: 16px 32px; background: #fff; border-bottom: 1px solid #e5e7eb; position: sticky; top: 0; z-index: 5; }
  #screen-dashboard h1 { font-size: 20px; color: #4f46e5; }
  .header-right { display: flex; align-items: center; gap: 12px; }
  #user-email { font-size: 13px; color: #6b7280; }
  #btn-logout { padding: 7px 14px; border-radius: 6px; font-size: 13px;
    color: #6b7280; border: 1px solid #d1d5db; }
  #btn-logout:hover { background: #f3f4f6; }
  #btn-new-project { background: #4f46e5; color: #fff; padding: 9px 18px;
    border-radius: 8px; font-weight: 600; font-size: 14px; }
  #btn-new-project:hover { background: #4338ca; }
  #dashboard-main { padding: 24px 32px; }
  #project-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 18px; }
  .project-card { background: #fff; border-radius: 10px; overflow: hidden; cursor: pointer;
    border: 1px solid #e5e7eb; transition: transform .15s, box-shadow .15s; position: relative; }
  .project-card:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,.08); }
  .project-card .thumb { aspect-ratio: 4/3; display: flex; align-items: center;
    justify-content: center; font-size: 32px; font-weight: 700; color: rgba(255,255,255,.7); }
  .project-card .info { padding: 12px; }
  .project-card .name { font-weight: 600; font-size: 14px; margin-bottom: 4px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .project-card .meta { color: #6b7280; font-size: 12px; }
  .project-card .delete-btn { position: absolute; top: 8px; right: 8px;
    width: 26px; height: 26px; border-radius: 50%; background: rgba(255,255,255,.9);
    color: #ef4444; font-weight: 700; opacity: 0; transition: opacity .15s; }
  .project-card:hover .delete-btn { opacity: 1; }
  #empty-state { color: #6b7280; text-align: center; padding: 80px 0; font-size: 15px; }
  #loading-state { color: #9ca3af; text-align: center; padding: 60px 0; font-size: 14px; }

  /* Modal */
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: flex;
    align-items: center; justify-content: center; z-index: 100; }
  .modal-content { background: #fff; border-radius: 12px; padding: 28px;
    width: 640px; max-width: 92vw; max-height: 90vh; overflow-y: auto; }
  .modal-content h2 { margin-bottom: 16px; font-size: 20px; }
  .modal-content label { display: block; font-size: 13px; font-weight: 600;
    color: #4b5563; margin: 14px 0 6px; }
  .modal-content input[type=text], .modal-content input[type=number] {
    width: 100%; padding: 9px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; }
  .size-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .size-btn { padding: 14px 8px; border: 2px solid #e5e7eb; border-radius: 8px;
    background: #fff; text-align: center; font-size: 12px; color: #4b5563; }
  .size-btn:hover { border-color: #a5b4fc; }
  .size-btn.active { border-color: #4f46e5; background: #eef2ff; color: #4338ca; font-weight: 600; }
  .size-btn .preview { background: linear-gradient(135deg, #cbd5e1, #94a3b8);
    border-radius: 4px; margin: 0 auto 8px; }
  .size-btn .dim { color: #9ca3af; font-size: 10px; margin-top: 2px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; }
  .modal-actions button { padding: 9px 18px; border-radius: 6px; font-weight: 600; font-size: 14px; }
  #btn-cancel-new { background: #f3f4f6; color: #374151; }
  #btn-create-new { background: #4f46e5; color: #fff; }
  #btn-create-new:disabled { opacity: .5; cursor: default; }
  .custom-size { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  /* Workspace */
  #screen-workspace { display: flex; flex-direction: column; }
  .workspace-header { height: 54px; background: #fff; border-bottom: 1px solid #e5e7eb;
    display: flex; align-items: center; justify-content: space-between; padding: 0 12px; gap: 12px; }
  .workspace-header .left, .workspace-header .center, .workspace-header .right {
    display: flex; align-items: center; gap: 8px; }
  .workspace-header button { padding: 6px 10px; border-radius: 6px; color: #4b5563; font-size: 14px; }
  .workspace-header button:hover { background: #f3f4f6; }
  .workspace-header button:disabled { opacity: .35; cursor: default; }
  #project-name-input { padding: 6px 10px; border: 1px solid transparent; border-radius: 6px;
    font-weight: 600; font-size: 14px; background: transparent; width: 220px; }
  #project-name-input:hover, #project-name-input:focus { border-color: #d1d5db; outline: none; }
  #save-status { font-size: 12px; color: #6b7280; margin-left: 4px; }
  .sep { color: #d1d5db; }
  #zoom-label { min-width: 46px; text-align: center; font-size: 12px; color: #6b7280; }
  #btn-save, #btn-download { background: #4f46e5; color: #fff !important; padding: 7px 16px !important; }
  #btn-save:hover, #btn-download:hover { background: #4338ca; }
  .dropdown { position: relative; }
  .dropdown-menu { position: absolute; top: 100%; right: 0; margin-top: 4px; background: #fff;
    border: 1px solid #e5e7eb; border-radius: 8px; box-shadow: 0 8px 20px rgba(0,0,0,.1);
    min-width: 220px; z-index: 20; padding: 4px; }
  .dropdown-menu button { display: block; width: 100%; text-align: left; padding: 8px 12px;
    font-size: 13px; border-radius: 4px; color: #374151 !important; }
  .dropdown-menu button:hover { background: #f3f4f6; }

  .workspace-main { flex: 1; display: flex; overflow: hidden; }
  .left-tools { width: 64px; background: #fff; border-right: 1px solid #e5e7eb;
    display: flex; flex-direction: column; align-items: center; padding: 12px 0; gap: 6px; }
  .left-tools button { width: 44px; height: 44px; border-radius: 8px; font-size: 20px;
    color: #4b5563; transition: background .15s; }
  .left-tools button:hover { background: #f3f4f6; }
  .left-tools button.uploading { opacity: .5; pointer-events: none; }

  .canvas-area { flex: 1; background: #e5e7eb; display: flex; overflow: hidden; }
  #canvas-scroll { flex: 1; overflow: auto; display: flex; background: #e5e7eb; }
  #canvas-inner { margin: auto; padding: 40px; }
  #canvas-wrap { box-shadow: 0 4px 18px rgba(0,0,0,.12); background: #fff; }
  #c { display: block; }

  .right-panel { width: 300px; background: #fff; border-left: 1px solid #e5e7eb;
    display: flex; flex-direction: column; overflow: hidden; }
  #panel-empty, #panel-object { padding: 14px; overflow-y: auto; max-height: 62vh; }
  #panel-empty p { font-size: 13px; color: #9ca3af; text-align: center; margin: 20px 0; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; font-weight: 600; color: #4b5563; margin-bottom: 5px; }
  .field input[type=color] { width: 100%; height: 34px; border: 1px solid #d1d5db;
    border-radius: 6px; cursor: pointer; padding: 2px; }
  .field input[type=number], .field select { width: 100%; padding: 7px 10px;
    border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; }
  .field input[type=range] { width: 100%; }
  .btn-group { display: flex; gap: 4px; }
  .btn-group button { flex: 1; padding: 7px; border: 1px solid #d1d5db; border-radius: 6px;
    font-size: 13px; background: #fff; color: #374151; }
  .btn-group button:hover { background: #f9fafb; }
  .btn-group button.active { background: #eef2ff; border-color: #4f46e5; color: #4338ca; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid #e5e7eb; margin-bottom: 12px; }
  .tab { padding: 8px 12px; font-size: 13px; color: #6b7280; border-bottom: 2px solid transparent; }
  .tab.active { color: #4f46e5; border-bottom-color: #4f46e5; font-weight: 600; }
  .tab-content .field button { padding: 7px 10px; border: 1px solid #d1d5db;
    border-radius: 6px; font-size: 13px; background: #fff; color: #374151; margin: 2px; }
  .tab-content .field button:hover { background: #f9fafb; }
  #btn-duplicate, #btn-delete { width: calc(50% - 3px); }
  #btn-delete { color: #ef4444 !important; border-color: #fecaca !important; }
  #btn-delete:hover { background: #fef2f2 !important; }
  .layers { flex: 1; overflow-y: auto; min-height: 120px; border-top: 1px solid #e5e7eb; padding: 10px; }
  .layers h3 { font-size: 12px; font-weight: 600; color: #6b7280; margin-bottom: 8px; text-transform: uppercase; }
  #layer-list { display: flex; flex-direction: column; gap: 4px; }
  .layer-item { display: flex; justify-content: space-between; align-items: center;
    padding: 6px 8px; background: #f9fafb; border-radius: 5px; cursor: pointer; font-size: 12px; gap: 6px; }
  .layer-item:hover { background: #f3f4f6; }
  .layer-item.active { background: #eef2ff; box-shadow: inset 3px 0 0 #4f46e5; }
  .layer-item .layer-label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .layer-del { color: #9ca3af; font-size: 11px; padding: 2px 4px; }
  .layer-del:hover { color: #ef4444; }

  /* Toast */
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #1f2937; color: #fff; padding: 11px 20px; border-radius: 8px;
    font-size: 14px; z-index: 1000; box-shadow: 0 4px 12px rgba(0,0,0,.2);
    animation: slideUp .25s ease; max-width: 90vw; }
  .toast.error { background: #dc2626; }
  .toast.success { background: #059669; }
  @keyframes slideUp { from { opacity: 0; transform: translate(-50%, 20px); }
    to { opacity: 1; transform: translate(-50%, 0); } }
</style>
</head>
<body>

<!-- Loading -->
<div id="screen-loading" class="screen">Đang tải...</div>

<!-- Auth -->
<div id="screen-auth" class="screen hidden">
  <div class="auth-card">
    <h1>Netizen Editor</h1>
    <p class="sub">Đăng nhập bằng email để bắt đầu thiết kế</p>
    <label>Email</label>
    <input type="email" id="auth-email" placeholder="ban@example.com" autocomplete="email">
    <button id="btn-send-link">Gửi link đăng nhập</button>
    <div id="auth-msg"></div>
  </div>
</div>

<!-- Dashboard -->
<div id="screen-dashboard" class="screen hidden">
  <header>
    <h1>Netizen Editor</h1>
    <div class="header-right">
      <span id="user-email"></span>
      <button id="btn-logout">Đăng xuất</button>
      <button id="btn-new-project">+ Tạo thiết kế mới</button>
    </div>
  </header>
  <main id="dashboard-main">
    <div id="loading-state">Đang tải dự án...</div>
    <div id="project-grid"></div>
    <div id="empty-state" class="hidden">Chưa có dự án nào. Nhấn <b>“Tạo thiết kế mới”</b> để bắt đầu.</div>
  </main>
</div>

<!-- Modal New Project -->
<div id="modal-new" class="modal hidden">
  <div class="modal-content">
    <h2>Tạo thiết kế mới</h2>
    <label>Tên thiết kế</label>
    <input id="new-name" type="text" placeholder="Thiết kế chưa đặt tên">
    <label>Chọn kích thước</label>
    <div id="size-presets" class="size-grid"></div>
    <label>Hoặc tùy chỉnh (px)</label>
    <div class="custom-size">
      <input id="custom-w" type="number" value="1080" min="100" max="5000">
      <input id="custom-h" type="number" value="1080" min="100" max="5000">
    </div>
    <div class="modal-actions">
      <button id="btn-cancel-new">Hủy</button>
      <button id="btn-create-new">Tạo</button>
    </div>
  </div>
</div>

<!-- Workspace -->
<div id="screen-workspace" class="screen hidden">
  <header class="workspace-header">
    <div class="left">
      <button id="btn-back" title="Về trang chủ">←</button>
      <input id="project-name-input" type="text">
      <span id="save-status"></span>
    </div>
    <div class="center">
      <button id="btn-undo" title="Hoàn tác (Ctrl+Z)">↶</button>
      <button id="btn-redo" title="Làm lại (Ctrl+Y)">↷</button>
      <span class="sep">|</span>
      <button id="btn-zoom-out">−</button>
      <span id="zoom-label">100%</span>
      <button id="btn-zoom-in">+</button>
      <button id="btn-fit" title="Vừa màn hình">Vừa màn hình</button>
    </div>
    <div class="right">
      <button id="btn-save">Lưu</button>
     <button id="btn-save-template" style="background: #059669; color: #fff !important; padding: 7px 16px !important;">Lưu Mẫu</button>
      <div class="dropdown">
        <button id="btn-download">Tải xuống ▾</button>
        <div class="dropdown-menu hidden" id="download-menu">
          <button data-format="png" data-quality="1" data-scale="2">PNG chất lượng cao</button>
          <button data-format="jpeg" data-quality="0.92" data-scale="2">JPG (nhẹ hơn)</button>
          <button data-format="png" data-quality="1" data-scale="1">PNG đúng kích thước gốc</button>
        </div>
      </div>
    </div>
  </header>
  <main class="workspace-main">
    <aside class="left-tools">
      <button data-tool="text" title="Văn bản">T</button>
      <button data-tool="image" title="Tải ảnh lên">🖼</button>
      <button data-tool="rect" title="Hình chữ nhật">▭</button>
      <button data-tool="circle" title="Hình tròn">◯</button>
      <button data-tool="triangle" title="Tam giác">△</button>
      <button data-tool="star" title="Ngôi sao">☆</button>
      <button data-tool="line" title="Đường kẻ">╱</button>
      <!-- NÚT THANH TRẠNG THÁI -->
      <button data-tool="statusbar" title="Thanh trạng thái (Sóng, Wifi, Pin)">📱</button>
    </aside>
    <section class="canvas-area">
      <div id="canvas-scroll">
        <div id="canvas-inner">
          <div id="canvas-wrap"><canvas id="c"></canvas></div>
        </div>
      </div>
    </section>
    <aside class="right-panel">
      <div id="panel-empty">
        <p>Chọn đối tượng để chỉnh sửa</p>
        <div class="field">
          <label>Màu nền canvas</label>
          <input type="color" id="bg-color" value="#ffffff">
        </div>
      </div>
      <div id="panel-object" class="hidden">
        <div class="tabs">
          <button data-tab="style" class="tab active">Kiểu</button>
          <button data-tab="arrange" class="tab">Sắp xếp</button>
          <button data-tab="pos" class="tab">Vị trí</button>
        </div>
        <div class="tab-content" data-tab-content="style">
         <div class="field">
          <label>Độ mờ: <span id="opacity-val">100</span>%</label>
          <input type="range" id="obj-opacity" min="0" max="100" value="100">
        </div>
        <!-- THÊM NÚT NÀY VÀO -->
        <div class="field">
          <button id="btn-crop" style="width: 100%; background: #a855f7; color: white; padding: 10px; border-radius: 6px; font-weight: bold; margin-top: 8px;">✂️ Cắt Ảnh</button>
        </div>
          <div class="field" id="field-color">
            <label>Màu</label>
            <input type="color" id="obj-color" value="#3b82f6">
          </div>
          <div id="text-fields" style="display:none">
            <div class="field">
              <label>Phông chữ</label>
             <select id="font-family">
  <optgroup label="Hệ thống / Phổ biến nhất">
    <option value="Arial, sans-serif">Arial</option>
    <option value="Helvetica, Arial, sans-serif">Helvetica</option>
    <option value="Roboto">Roboto</option>
    <!-- San Francisco (Apple System Font) -->
    <option value="-apple-system, BlinkMacSystemFont, 'San Francisco', 'Segoe UI', sans-serif">San Francisco (Apple)</option>
  </optgroup>
  
  <optgroup label="Sans-Serif (Không chân)">
    <option value="Inter">Inter</option>
    <option value="Open Sans">Open Sans</option>
    <option value="Lato">Lato</option>
    <option value="Montserrat">Montserrat</option>
    <option value="Poppins">Poppins</option>
    <option value="Be Vietnam Pro">Be Vietnam Pro</option>
    <option value="Nunito">Nunito</option>
    <option value="Raleway">Raleway</option>
    <option value="Oswald">Oswald</option>
    <option value="Bebas Neue">Bebas Neue</option>
    <option value="sans-serif">Sans-serif (Mặc định)</option>
  </optgroup>
  
  <optgroup label="Serif (Có chân)">
    <option value="Playfair Display">Playfair Display</option>
    <option value="Times New Roman, serif">Times New Roman</option>
    <option value="serif">Serif (Mặc định)</option>
  </optgroup>
  
  <optgroup label="Script (Viết tay)">
    <option value="Dancing Script">Dancing Script</option>
    <option value="Lobster">Lobster</option>
  </optgroup>
</select>
            </div>
            <div class="field">
              <label>Cỡ chữ</label>
              <input type="number" id="font-size" min="6" max="400" value="32">
            </div>
            <div class="field">
              <label>Định dạng</label>
              <div class="btn-group">
                <button id="btn-bold"><b>B</b></button>
                <button id="btn-italic"><i>I</i></button>
                <button id="btn-underline"><u>U</u></button>
              </div>
            </div>
            <div class="field">
              <label>Căn lề</label>
              <div class="btn-group">
                <button data-align="left">⇤</button>
                <button data-align="center">⇔</button>
                <button data-align="right">⇥</button>
                <button data-align="justify">≡</button>
              </div>
            </div>
          </div>
          <div class="field">
            <label>Độ mờ: <span id="opacity-val">100</span>%</label>
            <input type="range" id="obj-opacity" min="0" max="100" value="100">
          </div>
        </div>
        <div class="tab-content hidden" data-tab-content="arrange">
          <div class="field">
            <button id="btn-forward">Lên một lớp</button>
            <button id="btn-backward">Xuống một lớp</button>
            <button id="btn-front">Lên trên cùng</button>
            <button id="btn-back-layer">Xuống dưới cùng</button>
          </div>
        </div>
        <div class="tab-content hidden" data-tab-content="pos">
          <div class="field"><label>X</label><input type="number" id="pos-x"></div>
          <div class="field"><label>Y</label><input type="number" id="pos-y"></div>
          <div class="field"><label>Rộng</label><input type="number" id="pos-w"></div>
          <div class="field"><label>Cao</label><input type="number" id="pos-h"></div>
          <div class="field"><label>Góc xoay (°)</label><input type="number" id="pos-angle"></div>
          <div class="field">
            <button id="btn-duplicate">Nhân bản</button>
            <button id="btn-delete">Xóa</button>
          </div>
        </div>
      </div>
      <div class="layers">
        <h3>Lớp</h3>
        <div id="layer-list"></div>
      </div>
    </aside>
  </main>
</div>

function initCanvas(project) {
  const el = $('c');
  el.width = project.width;
  el.height = project.height;

  // TẮT CACHE VÀ RETINA SCALING ĐỂ TRÁNH LỖI NỬA TRẮNG NỬA ĐEN

  canvas = new fabric.Canvas('c', {
    width: project.width,
    height: project.height,
    backgroundColor: project.background || '#ffffff',
    preserveObjectStacking: true,
    selection: true,
    enableRetinaScaling: false // <--- Dòng quan trọng nhất để fix lỗi màn hình Retina
  });
  // BẬT CĂN LỀ THÔNG MINH
  enableSmartGuides(canvas);

  history = []; historyIndex = -1;
  isRestoring = true;

 
   if (project.data) {
    isRestoring = true;
    canvas.loadFromJSON(project.data, () => {
      
      // 1. Xử lý ẢNH NỀN (Background Image) nếu có
      if (canvas.backgroundImage) {
        const bgSrc = canvas.backgroundImage.getSrc();
        if (bgSrc) {
          canvas.backgroundImage.setSrc(bgSrc, () => {
            canvas.requestRenderAll();
          }, { crossOrigin: 'anonymous' });
        }
      }

      // 2. Xử lý các ẢNH CHÈN (Image Objects)
      canvas.getObjects().forEach(obj => {
        if (obj.type === 'image') {
          obj.set({ objectCaching: false });
          const imgSrc = obj.getSrc();
          if (imgSrc) {
            obj.setSrc(imgSrc, () => {
              canvas.requestRenderAll();
            }, { crossOrigin: 'anonymous' });
          }
        }
      });
      
      canvas.calcOffset();
      canvas.renderAll();
      isRestoring = false;
      
      // 3. QUAN TRỌNG: Ép Canvas tự động vẽ lại liên tục trong 2 giây đầu
      // Để đảm bảo dù ảnh tải nhanh hay chậm thì nó cũng phải hiện ra
      let renderCount = 0;
      const forceRenderInterval = setInterval(() => {
        canvas.renderAll();
        renderCount++;
        if (renderCount > 10) clearInterval(forceRenderInterval); // Dừng sau 10 lần (khoảng 2 giây)
      }, 200);
      
      saveHistory();
      refreshLayers();
      updateObjectPanel();
    });
  } else {
    // ... (Phần còn lại giữ nguyên)
    // Nếu là dự án MỚI TẠO, kiểm tra xem có template không
    isRestoring = false;
    if (project.name.includes('Bi') || (project.width === 828 && project.height === 1792 && project.name.includes('A'))) {
      applyTikTokTemplate();
    } else {
      saveHistory(); // Nếu không có template thì tạo canvas trống
    }
  }
  requestAnimationFrame(fitToScreen);
  setTimeout(fitToScreen, 100);

  canvas.on('object:added', () => { if (!isRestoring) { saveHistory(); markUnsaved(); } refreshLayers(); });
  canvas.on('object:removed', () => { if (!isRestoring) { saveHistory(); markUnsaved(); } refreshLayers(); updateObjectPanel(); });
  canvas.on('object:modified', () => { if (!isRestoring) { saveHistory(); markUnsaved(); } updateObjectPanel(); canvas.requestRenderAll(); });
  canvas.on('selection:created', () => { updateObjectPanel(); refreshLayers(); });
  canvas.on('selection:updated', () => { updateObjectPanel(); refreshLayers(); });
  canvas.on('selection:cleared', () => { updateObjectPanel(); refreshLayers(); });
}

// Hàm vẽ đường căn lề tự động
function enableSmartGuides(c) {
  const ctx = c.contextTop;
  let lines = [];
  const snapThreshold = 8;

  c.on('object:moving', function(e) {
    const obj = e.target;
    if (!obj) return;

    c.clearContext(c.contextTop);
    lines = [];

    const zoom = c.getZoom();
    const canvasW = currentProject ? currentProject.width : c.width / zoom;
    const canvasH = currentProject ? currentProject.height : c.height / zoom;

    const objBox = obj.getBoundingRect();
    
    let targetsX = [0, canvasW / 2, canvasW];
    let targetsY = [0, canvasH / 2, canvasH];

    c.getObjects().forEach(o => {
      if (o === obj || o.type === 'activeSelection') return;
      const b = o.getBoundingRect();
      targetsX.push(b.left, b.left + b.width / 2, b.left + b.width);
      targetsY.push(b.top, b.top + b.height / 2, b.top + b.height);
    });

    const objXPoints = [objBox.left, objBox.left + objBox.width / 2, objBox.left + objBox.width];
    const objYPoints = [objBox.top, objBox.top + objBox.height / 2, objBox.top + objBox.height];

    let bestSnapX = { dist: snapThreshold / zoom, target: null, objPoint: null };
    let bestSnapY = { dist: snapThreshold / zoom, target: null, objPoint: null };

    for (let i = 0; i < objXPoints.length; i++) {
      for (let j = 0; j < targetsX.length; j++) {
        const dist = Math.abs(objXPoints[i] - targetsX[j]);
        if (dist < bestSnapX.dist) bestSnapX = { dist, target: targetsX[j], objPoint: objXPoints[i] };
      }
    }

    for (let i = 0; i < objYPoints.length; i++) {
      for (let j = 0; j < targetsY.length; j++) {
        const dist = Math.abs(objYPoints[i] - targetsY[j]);
        if (dist < bestSnapY.dist) bestSnapY = { dist, target: targetsY[j], objPoint: objYPoints[i] };
      }
    }

    if (bestSnapX.target !== null) {
      obj.left += (bestSnapX.target - bestSnapX.objPoint);
      lines.push({ x1: bestSnapX.target, y1: 0, x2: bestSnapX.target, y2: canvasH, type: 'v' });
    }

    if (bestSnapY.target !== null) {
      obj.top += (bestSnapY.target - bestSnapY.objPoint);
      lines.push({ x1: 0, y1: bestSnapY.target, x2: canvasW, y2: bestSnapY.target, type: 'h' });
    }

    if (bestSnapX.target !== null || bestSnapY.target !== null) obj.setCoords();
  });

  c.on('mouse:up', function() {
    lines = [];
    c.clearContext(c.contextTop);
    c.requestRenderAll();
  });

  c.on('after:render', function() {
    if (lines.length > 0) {
      ctx.save();
      const zoom = c.getZoom();
      lines.forEach(line => {
        ctx.beginPath();
        if (line.type === 'v') {
          const x = line.x1 * zoom; 
          ctx.moveTo(x, 0);
          ctx.lineTo(x, c.getHeight());
        } else {
          const y = line.y1 * zoom;
          ctx.moveTo(0, y);
          ctx.lineTo(c.getWidth(), y);
        }
        ctx.strokeStyle = '#a855f7'; 
        ctx.lineWidth = 1.5; 
        ctx.setLineDash([6, 4]); 
        ctx.stroke();
      });
      ctx.restore();
    }
  });
}

/* ============================================================
   HISTORY
============================================================ */
function saveHistory() {
  if (isRestoring || !canvas) return;
  const json = canvas.toJSON(['id', 'name']);
  if (historyIndex >= 0) {
    const prev = JSON.stringify(history[historyIndex]);
    const curr = JSON.stringify(json);
    if (prev === curr) return;
  }
  history = history.slice(0, historyIndex + 1);
  history.push(json);
  if (history.length > 60) history.shift();
  historyIndex = history.length - 1;
  updateUndoRedo();
}
function undo() { if (historyIndex <= 0) return; historyIndex--; restoreHistory(); }
function redo() { if (historyIndex >= history.length - 1) return; historyIndex++; restoreHistory(); }
function restoreHistory() {
  isRestoring = true;
  canvas.loadFromJSON(history[historyIndex], () => {
    canvas.renderAll();
    isRestoring = false;
    updateUndoRedo();
    updateObjectPanel();
    refreshLayers();
    markUnsaved();
  });
}
function updateUndoRedo() {
  $('btn-undo').disabled = historyIndex <= 0;
  $('btn-redo').disabled = historyIndex >= history.length - 1;
}

/* ============================================================
   SAVE (debounced)
============================================================ */
function markUnsaved() {
  dirty = true;
  $('save-status').textContent = 'Chưa lưu...';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => saveCurrentProject(true), 2000);
}

async function saveCurrentProject(silent = false) {
  if (!currentProject || !canvas) return;
  clearTimeout(saveTimer);

  const json = canvas.toJSON(['id', 'name']);
  const name = $('project-name-input').value.trim() || currentProject.name;
  const background = (typeof canvas.backgroundColor === 'string')
    ? canvas.backgroundColor : '#ffffff';

  $('save-status').textContent = 'Đang lưu...';

  const { error } = await sb
    .from('projects')
    .update({ name, background, data: json, updated_at: new Date().toISOString() })
    .eq('id', currentProject.id);

  if (error) {
    $('save-status').textContent = 'Lỗi lưu';
    if (!silent) toast('Lỗi lưu: ' + error.message, 'error');
    return;
  }

  currentProject.name = name;
  currentProject.background = background;
  dirty = false;
  $('save-status').textContent = 'Đã lưu ✓';
  setTimeout(() => { if (!dirty) $('save-status').textContent = ''; }, 1500);
}

/* ============================================================
   ZOOM
============================================================ */
function applyZoom(z) {
  if (!canvas || !currentProject) return;
  currentZoom = Math.max(0.05, Math.min(4, z));
  canvas.setZoom(currentZoom);
  
  canvas.setDimensions({
    width: currentProject.width * currentZoom,
    height: currentProject.height * currentZoom
  }); 
  
  canvas.renderAll();
  $('zoom-label').textContent = Math.round(currentZoom * 100) + '%';
}
function fitToScreen() {
  if (!canvas || !currentProject) return;
  const scroll = $('canvas-scroll');
  const aw = scroll.clientWidth - 60;
  const ah = scroll.clientHeight - 60;
  if (aw <= 0 || ah <= 0) return;
  applyZoom(Math.min(aw / currentProject.width, ah / currentProject.height, 1));
}
$('btn-zoom-in').addEventListener('click', () => applyZoom(currentZoom * 1.15));
$('btn-zoom-out').addEventListener('click', () => applyZoom(currentZoom / 1.15));
$('btn-fit').addEventListener('click', fitToScreen);
$('btn-undo').addEventListener('click', undo);
$('btn-redo').addEventListener('click', redo);

    originX: 'center', originY: 'center',
    fontSize: 40, fontFamily: 'Inter', fill: '#1f2937',
    width: 400, textAlign: 'center',
    splitByGrapheme: true,
    objectCaching: false
  });
  canvas.add(t); 
  canvas.setActiveObject(t); 
  canvas.renderAll();
}

function getStarPoints(spikes, outerR, innerR) {
  const pts = [];
  for (let i = 0; i < spikes * 2; i++) {
    const r = i % 2 === 0 ? outerR : innerR;
    const a = (Math.PI / spikes) * i - Math.PI / 2;
    pts.push({ x: Math.cos(a) * r, y: Math.sin(a) * r });
  }
  return pts;
}

function addShape(type) {
  const cx = canvas.getWidth() / 2, cy = canvas.getHeight() / 2;
  const opts = { left: cx, top: cy, originX: 'center', originY: 'center', fill: '#3b82f6' };
  let shape;
  if (type === 'rect') shape = new fabric.Rect({ ...opts, width: 240, height: 160 });
  else if (type === 'circle') shape = new fabric.Circle({ ...opts, radius: 110 });
  else if (type === 'triangle') shape = new fabric.Triangle({ ...opts, width: 200, height: 180 });
  else if (type === 'star') shape = new fabric.Polygon(getStarPoints(5, 110, 48), { ...opts });
  else if (type === 'line') shape = new fabric.Line([cx - 120, cy, cx + 120, cy], { stroke: '#1f2937', strokeWidth: 4 });
  if (shape) { canvas.add(shape); canvas.setActiveObject(shape); canvas.renderAll(); }
}

// HÀM TẠO THANH TRẠNG THÁI
function addStatusBar() {
  const scale = 2; // Tăng scale để nhìn rõ hơn trên canvas lớn
  
  // 1. Sóng di động
  const s1 = new fabric.Rect({ width: 4*scale, height: 8*scale, fill: '#333', rx: 1, ry: 1, left: 0, top: 12*scale });

  const s4 = new fabric.Rect({ width: 4*scale, height: 20*scale, fill: '#333', rx: 1, ry: 1, left: 18*scale, top: 0 });
  const signalGroup = new fabric.Group([s1, s2, s3, s4], { left: 0, top: 0 });

  // 2. Wifi (Dùng path chuẩn)
  const wifiPath = "M12 21a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm-2.8-7.2c1.6-1.2 4-1.2 5.6 0l1.6-1.6a8 8 0 0 0-8.8 0l1.6 1.6zm-3.2-3.2c3.2-2.4 8-2.4 11.2 0l1.6-1.6a12 12 0 0 0-14.4 0l1.6 1.6z";
  const wifiObj = new fabric.Path(wifiPath, { fill: '#333', left: 35*scale, top: 2*scale, scaleX: scale*0.7, scaleY: scale*0.7 });

  // 3. Pin
  const batBody = new fabric.Rect({ width: 24*scale, height: 12*scale, fill: 'transparent', stroke: '#333', strokeWidth: 2*scale, rx: 3*scale, ry: 3*scale, left: 75*scale, top: 4*scale });
  const batTip = new fabric.Rect({ width: 2*scale, height: 4*scale, fill: '#333', rx: 1, ry: 1, left: 100*scale, top: 8*scale });
  // Cột năng lượng (chỉnh độ rộng width này để thay đổi mức pin)
  const batLevel = new fabric.Rect({ width: 16*scale, height: 6*scale, fill: '#333', rx: 1, ry: 1, left: 78*scale, top: 7*scale }); 
  
  // 4. Chữ số % Pin
  const batText = new fabric.Textbox('7', { fontSize: 12*scale, fontFamily: 'Inter', fill: '#333', left: 83*scale, top: 5*scale, width: 20*scale, textAlign: 'center', fontWeight: 'bold' });

  // Gom tất cả lại thành 1 khối
  const statusGroup = new fabric.Group([signalGroup, wifiObj, batBody, batTip, batLevel, batText], {
    left: canvas.getWidth() / 2,
    top: canvas.getHeight() / 2,
    originX: 'center',
    originY: 'center',
    name: 'Thanh trạng thái'
  });
  
  canvas.add(statusGroup);
  canvas.setActiveObject(statusGroup);
  canvas.renderAll();
}

// Hàm tách nhóm để chỉnh sửa từng phần
function ungroupSelected() {
  const activeObject = canvas.getActiveObject();
  if (!activeObject || activeObject.type !== 'group') return;
  
  activeObject.toActiveSelection();
  canvas.requestRenderAll();
  saveHistory();

/* ============================================================
   IMAGE UPLOAD
============================================================ */
$('file-image').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;

  const uploadBtn = document.querySelector('.left-tools button[data-tool="image"]');
  uploadBtn.classList.add('uploading');
  toast('Đang tải ảnh lên...');

  try {
    const publicUrl = await uploadImageToStorage(file);
    await addImageToCanvas(publicUrl);
    toast('Đã thêm ảnh', 'success');
  } catch (err) {
    toast('Lỗi upload: ' + err.message, 'error');
  } finally {
    uploadBtn.classList.remove('uploading');
  }
});

async function uploadImageToStorage(file) {
  if (file.size > 5 * 1024 * 1024) {
    throw new Error('Ảnh quá lớn (giới hạn 5MB)');
  }
  const ext = (file.name.split('.').pop() || 'png').toLowerCase();
  const path = `${currentUser.id}/${uid()}.${ext}`;

  const { error } = await sb.storage
    .from(STORAGE_BUCKET)
    .upload(path, file, { contentType: file.type, upsert: false });

  if (error) throw error;

  const { data } = sb.storage.from(STORAGE_BUCKET).getPublicUrl(path);
  return data.publicUrl;
}

function addImageToCanvas(url) {
  return new Promise((resolve, reject) => {
    fabric.Image.fromURL(url, (img) => {
      if (!img.width || !img.height) { reject(new Error('Ảnh không hợp lệ')); return; }
      const maxW = canvas.getWidth() * 0.6;
      const maxH = canvas.getHeight() * 0.6;
      const s = Math.min(maxW / img.width, maxH / img.height, 1);
      img.set({
        scaleX: s, scaleY: s,
        left: canvas.getWidth() / 2, top: canvas.getHeight() / 2,
        originX: 'center', originY: 'center'
      });
      canvas.add(img);
      canvas.setActiveObject(img);
      canvas.renderAll();
      resolve();
    }, { crossOrigin: 'anonymous' });
  });
}

/* ============================================================
   OBJECT PANEL
============================================================ */
function normalizeColor(c) {
  if (typeof c !== 'string') return '#000000';
  if (/^#[0-9a-f]{6}$/i.test(c)) return c;
  if (/^#[0-9a-f]{3}$/i.test(c)) return '#' + c[1]+c[1]+c[2]+c[2]+c[3]+c[3];
  return '#000000';
}

function updateObjectPanel() {
  if (!canvas) return;
  const obj = canvas.getActiveObject();
  const pEmpty = $('panel-empty'), pObj = $('panel-object');
  if (!obj || obj.type === 'activeSelection') {
    pEmpty.style.display = 'block'; pObj.classList.add('hidden'); return;
  }
  pEmpty.style.display = 'none'; pObj.classList.remove('hidden');

  const isText = ['textbox','i-text','text'].includes(obj.type);
  $('text-fields').style.display = isText ? 'block' : 'none';
  $('field-color').style.display = isText ? 'none' : 'block';
  $('obj-color').value = normalizeColor(obj.fill || '#000000');

  if (isText) {
    $('font-family').value = obj.fontFamily || 'Inter';
    $('font-size').value = obj.fontSize || 32;
    $('btn-bold').classList.toggle('active', obj.fontWeight === 'bold');
    $('btn-italic').classList.toggle('active', obj.fontStyle === 'italic');
    $('btn-underline').classList.toggle('active', !!obj.underline);
    document.querySelectorAll('[data-align]').forEach(b =>
      b.classList.toggle('active', obj.textAlign === b.dataset.align));
  }
  const op = Math.round((obj.opacity ?? 1) * 100);
  $('obj-opacity').value = op;
  $('opacity-val').textContent = op;
  $('pos-x').value = Math.round(obj.left || 0);
  $('pos-y').value = Math.round(obj.top || 0);
  $('pos-w').value = Math.round((obj.width || 0) * (obj.scaleX || 1));
  $('pos-h').value = Math.round((obj.height || 0) * (obj.scaleY || 1));
  $('pos-angle').value = Math.round(obj.angle || 0);
}

const getActive = () => canvas && canvas.getActiveObject();
const refresh = () => { if (canvas) { canvas.renderAll(); saveHistory(); markUnsaved(); updateObjectPanel(); } };

$('bg-color').addEventListener('input', (e) => {
  if (!canvas) return;
  canvas.setBackgroundColor(e.target.value, () => canvas.renderAll());
  markUnsaved();
});

document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
    document.querySelector(`[data-tab-content="${t.dataset.tab}"]`).classList.remove('hidden');
  });
});

$('obj-color').addEventListener('input', e => {
  const o = getActive(); if (!o) return;
  o.set('fill', e.target.value); canvas.renderAll();
});
$('obj-color').addEventListener('change', () => { saveHistory(); markUnsaved(); });

$('font-family').addEventListener('change', e => {
  const o = getActive(); if (!o) return;
  o.set('fontFamily', e.target.value);
  if (document.fonts) document.fonts.load(`${o.fontSize || 32}px "${e.target.value}"`);

});
$('font-size').addEventListener('input', e => {
  const o = getActive(); if (!o) return;
  o.set('fontSize', parseInt(e.target.value) || 12); canvas.renderAll();
});

$('btn-bold').addEventListener('click', () => {

$('btn-italic').addEventListener('click', () => {

});

  const o = getActive(); if (!o) return;

});
document.querySelectorAll('[data-align]').forEach(b => {
  b.addEventListener('click', () => {
    const o = getActive(); if (!o) return;
    o.set('textAlign', b.dataset.align); refresh();
  });
});

$('obj-opacity').addEventListener('input', e => {
  const o = getActive(); if (!o) return;
  o.set('opacity', parseInt(e.target.value) / 100);
  $('opacity-val').textContent = e.target.value;
  canvas.renderAll();
});
$('obj-opacity').addEventListener('change', () => { saveHistory(); markUnsaved(); });

$('btn-forward').addEventListener('click', () => { const o = getActive(); if (o) { canvas.bringForward(o); refresh(); }});
$('btn-backward').addEventListener('click', () => { const o = getActive(); if (o) { canvas.sendBackwards(o); refresh(); }});
$('btn-front').addEventListener('click', () => { const o = getActive(); if (o) { canvas.bringToFront(o); refresh(); }});
$('btn-back-layer').addEventListener('click', () => { const o = getActive(); if (o) { canvas.sendToBack(o); refresh(); }});

['pos-x','pos-y','pos-w','pos-h','pos-angle'].forEach(id => {
  $(id).addEventListener('change', e => {
    const o = getActive(); if (!o) return;
    const v = parseFloat(e.target.value) || 0;
    if (id === 'pos-x') o.set('left', v);
    else if (id === 'pos-y') o.set('top', v);
    else if (id === 'pos-w') o.set('scaleX', v / (o.width || 1));
    else if (id === 'pos-h') o.set('scaleY', v / (o.height || 1));
    else if (id === 'pos-angle') o.set('angle', v);
    canvas.renderAll(); saveHistory(); markUnsaved();
  });
});

$('btn-duplicate').addEventListener('click', () => {
  const o = getActive(); if (!o) return;
  o.clone(c => {
    c.set({ left: (o.left || 0) + 24, top: (o.top || 0) + 24 });
    canvas.add(c); canvas.setActiveObject(c); canvas.renderAll();
  });
});
$('btn-delete').addEventListener('click', () => {
  const o = getActive(); if (!o) return;
  canvas.remove(o); canvas.discardActiveObject(); canvas.renderAll();
});

/* ============================================================
   LAYERS
============================================================ */
function refreshLayers() {
  const list = $('layer-list');
  if (!canvas) { list.innerHTML = ''; return; }
  list.innerHTML = '';
  const objects = canvas.getObjects();
  const active = canvas.getActiveObject();
  for (let i = objects.length - 1; i >= 0; i--) {
    const obj = objects[i];
    const div = document.createElement('div');
    div.className = 'layer-item' + (obj === active ? ' active' : '');
    let label = obj.type;
    if (['textbox','i-text','text'].includes(obj.type)) label = (obj.text || 'Text').slice(0, 24) || 'Text';
    else if (obj.type === 'image') label = 'Ảnh';
    else if (obj.type === 'rect') label = 'Hình chữ nhật';
    else if (obj.type === 'circle') label = 'Hình tròn';
    else if (obj.type === 'triangle') label = 'Tam giác';
    else if (obj.type === 'line') label = 'Đường kẻ';
    else if (obj.type === 'polygon') label = 'Đa giác';
    else if (obj.type === 'group') label = obj.name || 'Nhóm';

    div.innerHTML = `<span class="layer-label">${escapeHtml(label)}</span>
      <button class="layer-del" title="Xóa">✕</button>`;
    div.addEventListener('click', (e) => {
      if (e.target.classList.contains('layer-del')) return;
      canvas.setActiveObject(obj); canvas.renderAll();
      updateObjectPanel(); refreshLayers();
    });
    div.querySelector('.layer-del').addEventListener('click', (e) => {
      e.stopPropagation();
      canvas.remove(obj); canvas.renderAll();
    });
    list.appendChild(div);
  }
}

   EXPORT

$('btn-download').addEventListener('click', (e) => {
  e.stopPropagation();
  $('download-menu').classList.toggle('hidden');
});
document.addEventListener('click', () => $('download-menu').classList.add('hidden'));

$('download-menu').querySelectorAll('button').forEach(b => {
  b.addEventListener('click', () => {
    downloadImage(b.dataset.format, b.dataset.quality, parseInt(b.dataset.scale));
    $('download-menu').classList.add('hidden');
  });
});

function downloadImage(format, quality, scale) {
  if (!canvas || !currentProject) return;
  try {
    // Đưa canvas về kích thước gốc 100% để chụp chuẩn xác
    const oldZoom = canvas.getZoom();
    const oldWidth = canvas.getWidth();
    const oldHeight = canvas.getHeight();

    canvas.setZoom(1);
    canvas.setDimensions({ width: currentProject.width, height: currentProject.height });
    canvas.renderAll();

    const dataURL = canvas.toDataURL({
      format: format === 'jpeg' ? 'jpeg' : 'png',
      quality: parseFloat(quality) || 1,
      multiplier: scale 
    });

    // Trả lại trạng thái zoom cũ
    canvas.setZoom(oldZoom);
    canvas.setDimensions({ width: oldWidth, height: oldHeight });
    canvas.renderAll();

    const a = document.createElement('a');
    a.download = `${sanitizeFilename(currentProject.name)}.${format}`;
    a.href = dataURL;
    a.click();
    toast('Đã tải xuống', 'success');
  } catch (err) {
    toast('Lỗi xuất ảnh: ' + err.message, 'error');
  }
}

/* ============================================================
   KEYBOARD SHORTCUTS
============================================================ */
document.addEventListener('keydown', (e) => {
  if (!canvas) return;
  const tag = (e.target.tagName || '').toLowerCase();
  if (['input','textarea','select'].includes(tag) || e.target.isContentEditable) return;
  const active = canvas.getActiveObject();
  if (active && active.isEditing) return;

  if (e.key === 'Delete' || e.key === 'Backspace') {
    if (active) {
      if (active.type === 'activeSelection') {
        active.forEachObject(o => canvas.remove(o));
        canvas.discardActiveObject();
      } else canvas.remove(active);
      canvas.renderAll();
      e.preventDefault();
    }
  } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
    e.preventDefault();
    e.shiftKey ? redo() : undo();
  } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') {
    e.preventDefault(); redo();
  } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'd') {
    e.preventDefault(); $('btn-duplicate').click();
  } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
    e.preventDefault(); saveCurrentProject(false);
  } else if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 'g') {
    e.preventDefault(); 
    ungroupSelected();
  }
});

 $('btn-save-template').addEventListener('click', async () => {

 /* ============================================================
   LOGIC CẮT ẢNH (CROP) GIỐNG CANVA
============================================================ */
let isCropping = false;
let cropOverlay = null;
let imageToCrop = null;

$('btn-crop').addEventListener('click', () => {
  const o = getActive();
  
  // Nếu đang cắt mà bấm lần nữa -> Lưu lại
  if (isCropping) {
    isCropping = false;
    $('btn-crop').innerText = '✂️ Cắt Ảnh';
    $('btn-crop').style.background = '#a855f7';
    
    if (imageToCrop && cropOverlay) {
      // Chuyển clipPath sang tương đối (để nó đi theo ảnh khi di chuyển)
      cropOverlay.set({ absolutePositioned: false });
      
      // Tính toán lại tọa độ tương đối của khung cắt so với ảnh
      const zoom = canvas.getZoom();
      const img = imageToCrop;
      const rect = cropOverlay;
      
      // Lấy góc trên cùng bên trái của ảnh và khung cắt
      const imgBounds = img.getBoundingRect();
      const rectBounds = rect.getBoundingRect();
      
      // Cập nhật lại kích thước và vị trí của clipPath (tương đối so với ảnh)
      img.clipPath = new fabric.Rect({
        left: (rectBounds.left - imgBounds.left) / zoom,
        top: (rectBounds.top - imgBounds.top) / zoom,
        width: (rectBounds.width / zoom),
        height: (rectBounds.height / zoom),
        originX: 'left',
        originY: 'top',
        absolutePositioned: false
      });
      
      img.set({ selectable: true, opacity: 1 });
      canvas.remove(cropOverlay); // Xóa khung tím
      canvas.setActiveObject(img);
    }
    canvas.renderAll();
    saveHistory();
    markUnsaved();
    return;
  }

  // Bắt đầu cắt
  if (!o || o.type !== 'image') { 
    toast('Vui lòng chọn một bức ảnh để cắt!', 'error'); 
    return; 
  }
  
  isCropping = true;
  imageToCrop = o;
  $('btn-crop').innerText = '✅ Lưu Cắt';
  $('btn-crop').style.background = '#10b981'; // Đổi màu xanh
  
  // Làm mờ ảnh gốc
  o.set({ selectable: false, opacity: 0.5 });
  
  // Tạo khung cắt màu tím
  cropOverlay = new fabric.Rect({
    left: o.left,
    top: o.top,
    width: o.width * o.scaleX,
    height: o.height * o.scaleY,
    originX: o.originX,
    originY: o.originY,
    angle: o.angle,
    fill: 'transparent',
    stroke: '#a855f7',
    strokeWidth: 2,
    strokeDashArray: [5, 5],
    cornerColor: '#a855f7',
    cornerStyle: 'circle',
    absolutePositioned: true // Tạm thời để tuyệt đối để dễ kéo thả
  });
  
  o.set({ clipPath: cropOverlay }); // Gắn khung vào ảnh để xem trước
  
  canvas.add(cropOverlay);
  canvas.setActiveObject(cropOverlay);
  canvas.renderAll();
});

// Tự động cập nhật khung cắt nếu người dùng di chuyển ảnh (khi đang cắt)
canvas.on('object:moving', (e) => {
  if (isCropping && e.target === imageToCrop && cropOverlay) {
    cropOverlay.set({
      left: e.target.left,
      top: e.target.top,
      angle: e.target.angle
    });
  }
});
