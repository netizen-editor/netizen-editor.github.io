<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Netizen Editor - Professional Design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Thêm thư viện Icon FontAwesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/fabric@5.3.0/dist/fabric.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg-body: #f9fafb;
    --bg-panel: #ffffff;
    --text-main: #1f2937;
    --text-muted: #6b7280;
    --border-color: #e5e7eb;
    --primary: #8b5cf6; /* Tím Canva */
    --primary-hover: #7c3aed;
    --danger: #ef4444;
    --success: #10b981;
    --canvas-bg: #f3f4f6;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
    --shadow-lg: 0 10px 25px rgba(0,0,0,0.1);
    --radius-md: 12px;
    --radius-lg: 20px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: 'Inter', sans-serif; background: var(--bg-body); color: var(--text-main); height: 100vh; height: 100dvh; overflow: hidden; }
  button { cursor: pointer; font-family: inherit; border: none; background: none; touch-action: manipulation; transition: all 0.2s; }
  input, select { font-family: inherit; touch-action: manipulation; color: var(--text-main); }
  .hidden { display: none !important; }
  .screen { height: 100vh; height: 100dvh; overflow: hidden; }

  /* Scrollbar Styles */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 10px; }

  /* ================= AUTH ================= */
  #screen-loading, #screen-auth {
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #a78bfa 0%, #3b82f6 100%); padding: 20px;
  }
  #screen-loading { color: #fff; font-size: 18px; font-weight: 500; }
  .auth-card { background: var(--bg-panel); padding: 32px; border-radius: var(--radius-lg); width: 400px; max-width: 100%; box-shadow: var(--shadow-lg); }
  .auth-card h1 { font-size: 26px; color: var(--primary); margin-bottom: 8px; text-align: center; font-weight: 700; letter-spacing: -0.5px;}
  .auth-card .sub { color: var(--text-muted); font-size: 14px; text-align: center; margin-bottom: 24px; }
  .auth-card label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; }
  .auth-card input { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border-color); font-size: 14px; margin-bottom: 16px; outline: none; transition: border 0.2s;}
  .auth-card input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2); }
  .auth-card button { width: 100%; padding: 14px; background: var(--primary); color: #fff; border-radius: 10px; font-weight: 600; font-size: 15px; }
  .auth-card button:hover { background: var(--primary-hover); }
  #auth-msg { font-size: 13px; text-align: center; margin-top: 14px; min-height: 20px; color: var(--success); font-weight: 500; }
  #auth-msg.error { color: var(--danger); }

  /* ================= DASHBOARD ================= */
  #screen-dashboard { overflow-y: auto; background: var(--bg-body); padding-bottom: 70px; /* Chừa chỗ cho Bottom Nav */ }
  
  .dash-header { 
    background: linear-gradient(135deg, #e0e7ff 0%, #f3e8ff 100%);
    padding: 30px 24px 40px; border-bottom-left-radius: 24px; border-bottom-right-radius: 24px;
    position: relative;
  }
  .top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
  .logo { font-size: 22px; font-weight: 700; color: #4c1d95; display: flex; align-items: center; gap: 8px; }
  .logo i { color: #8b5cf6; }
  .user-profile { display: flex; align-items: center; gap: 12px; }
  #user-email { font-size: 13px; color: #4c1d95; font-weight: 500; max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .btn-icon { width: 36px; height: 36px; border-radius: 50%; background: #fff; color: #4c1d95; display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-sm); }
  
  .search-bar { 
    background: #fff; border-radius: 30px; padding: 12px 20px; display: flex; align-items: center; gap: 12px;
    box-shadow: var(--shadow-md); margin-top: -20px; margin-left: 24px; margin-right: 24px; position: relative; z-index: 2;
  }
  .search-bar i { color: #9ca3af; font-size: 16px; }
  .search-bar input { border: none; background: transparent; width: 100%; font-size: 15px; outline: none; }

  .dash-content { padding: 24px; }
  .section-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
  .section-title span { font-size: 14px; color: var(--primary); font-weight: 500; cursor: pointer; }

  .btn-create-main { 
    background: var(--primary); color: #fff; padding: 16px; border-radius: var(--radius-md); 
    font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; box-shadow: var(--shadow-md); margin-bottom: 24px;
  }
  .btn-create-main:hover { background: var(--primary-hover); transform: translateY(-2px); }

  #project-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
  @media (min-width: 768px) { #project-grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 24px; } }
  
  .project-card { 
    background: #fff; border-radius: var(--radius-md); overflow: hidden; cursor: pointer; 
    box-shadow: var(--shadow-sm); position: relative; aspect-ratio: 3/4; display: flex; flex-direction: column;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .project-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); }
  .project-card .thumb { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: 700; color: rgba(255,255,255,0.9); background: #e5e7eb; }
  .project-card .info { padding: 12px; background: #fff; border-top: 1px solid var(--border-color); }
  .project-card .name { font-weight: 600; font-size: 14px; margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .project-card .meta { color: var(--text-muted); font-size: 11px; }
  .project-card .delete-btn { position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; border-radius: 50%; background: rgba(255,255,255,0.9); color: var(--danger); display: flex; align-items: center; justify-content: center; opacity: 0; box-shadow: var(--shadow-sm); }
  .project-card:hover .delete-btn { opacity: 1; }
  
  #empty-state { color: var(--text-muted); text-align: center; padding: 40px 0; font-size: 15px; }
  
  /* Bottom Navigation */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0; height: 65px; background: #fff;
    border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; align-items: center;
    z-index: 100; padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (min-width: 768px) { .bottom-nav { display: none; } }
  .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #9ca3af; font-size: 10px; font-weight: 500; }
  .nav-item i { font-size: 20px; }
  .nav-item.active { color: var(--primary); }

  /* ================= MODAL ================= */
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; backdrop-filter: blur(4px); }
  .modal-content { background: var(--bg-panel); border-radius: var(--radius-lg); padding: 24px; width: 600px; max-width: 100%; max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow-lg); }
  .modal-content h2 { margin-bottom: 20px; font-size: 20px; font-weight: 700; }
  .modal-content label { display: block; font-size: 13px; font-weight: 600; color: var(--text-muted); margin: 16px 0 8px; }
  .modal-content input[type=text], .modal-content input[type=number] { width: 100%; padding: 12px 14px; border-radius: 8px; border: 1px solid var(--border-color); font-size: 14px; outline: none; }
  .size-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  @media(max-width: 500px) { .size-grid { grid-template-columns: repeat(2, 1fr); } }
  .size-btn { padding: 16px 8px; border: 2px solid var(--border-color); border-radius: 10px; background: #fff; text-align: center; font-size: 12px; font-weight: 500; color: var(--text-main); }
  .size-btn.active { border-color: var(--primary); background: #f5f3ff; color: var(--primary); font-weight: 600; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px; }
  .modal-actions button { padding: 12px 20px; border-radius: 8px; font-weight: 600; font-size: 15px; }
  #btn-cancel-new { background: var(--bg-body); color: var(--text-main); }
  #btn-create-new { background: var(--primary); color: #fff; }

  /* ================= WORKSPACE (EDITOR) ================= */
  #screen-workspace { display: flex; flex-direction: column; background: var(--canvas-bg); height: 100vh; height: 100dvh; overflow: hidden; }
  
  .workspace-header { 
    flex-shrink: 0; background: #fff; border-bottom: 1px solid var(--border-color);
    display: flex; align-items: center; justify-content: space-between; padding: 0 16px; gap: 12px; z-index: 20; min-height: 56px;
  }
  .header-left, .header-right { display: flex; align-items: center; gap: 8px; }
  .header-center { display: flex; align-items: center; gap: 4px; }
  
  .btn-header { width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--text-main); font-size: 16px; }
  .btn-header:hover { background: var(--bg-body); }
  .btn-header:disabled { opacity: 0.3; }
  
  #project-name-input { padding: 6px 10px; border: 1px solid transparent; border-radius: 6px; font-weight: 600; font-size: 15px; background: transparent; width: 140px; color: var(--text-main); text-align: center; }
  #project-name-input:focus { border-color: var(--border-color); background: var(--bg-body); outline: none; }
  #save-status { font-size: 12px; color: var(--success); font-weight: 500; display: none; }

  #btn-save { background: var(--primary); color: #fff; padding: 8px 16px; border-radius: 8px; font-weight: 600; font-size: 14px; }
  #btn-save:hover { background: var(--primary-hover); }
  
  .dropdown { position: relative; }
  .btn-download { padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border-color); background: #fff; color: var(--text-main); font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 6px; }
  .dropdown-menu { position: absolute; top: calc(100% + 8px); right: 0; background: #fff; border: 1px solid var(--border-color); border-radius: 12px; box-shadow: var(--shadow-lg); min-width: 200px; z-index: 100; padding: 6px; }
  .dropdown-menu button { display: block; width: 100%; text-align: left; padding: 10px 14px; font-size: 14px; border-radius: 8px; color: var(--text-main); font-weight: 500; }
  .dropdown-menu button:hover { background: var(--bg-body); }

  .workspace-main { flex: 1; display: flex; overflow: hidden; position: relative; width: 100%; }
  
  /* Canvas Area */
  .canvas-area { flex: 1; background: var(--canvas-bg); display: flex; overflow: hidden; position: relative; }
  #canvas-scroll { flex: 1; width: 100%; height: 100%; overflow: auto; display: flex; overscroll-behavior: contain; }
  #canvas-inner { margin: auto; padding: 40px; display: flex; align-items: center; justify-content: center; min-width: 100%; min-height: 100%; }
  #canvas-wrap { box-shadow: 0 4px 20px rgba(0,0,0,0.1); background: #fff; border-radius: 4px; }
  #c { display: block; }

  /* Toolbar Bottom (Mobile) / Left (Desktop) */
  .left-tools { 
    width: 72px; background: #fff; border-right: 1px solid var(--border-color);
    display: flex; flex-direction: column; align-items: center; padding: 16px 0; gap: 8px; z-index: 10; overflow-y: auto; flex-shrink: 0; 
  }
  .tool-btn { width: 48px; height: 48px; border-radius: 12px; font-size: 20px; color: var(--text-muted); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
  .tool-btn i { font-size: 20px; }
  .tool-btn span { font-size: 10px; font-weight: 500; }
  .tool-btn:hover { background: var(--bg-body); color: var(--primary); }

  /* Right Panel Desktop */
  .right-panel { width: 320px; background: #fff; border-left: 1px solid var(--border-color); display: flex; flex-direction: column; overflow: hidden; z-index: 15; flex-shrink: 0; }
  .panel-mobile-header { display: none; }

  #panel-empty, #panel-object { padding: 20px; overflow-y: auto; flex-shrink: 0;}
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
  .field input[type=color] { width: 100%; height: 40px; border: 1px solid var(--border-color); border-radius: 8px; cursor: pointer; padding: 4px; }
  .field input[type=number], .field select { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border-color); font-size: 14px; outline: none; }
  .field input[type=range] { width: 100%; accent-color: var(--primary); }
  .btn-group { display: flex; gap: 6px; flex-wrap: wrap; }
  .btn-group button { flex: 1; min-width: 44px; padding: 8px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 14px; background: #fff; color: var(--text-main); font-weight: 500; }
  .btn-group button.active { background: #f5f3ff; border-color: var(--primary); color: var(--primary); font-weight: 600; }
  
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border-color); margin-bottom: 16px; }
  .tab { padding: 10px 16px; font-size: 14px; font-weight: 600; color: var(--text-muted); border-bottom: 2px solid transparent; cursor: pointer; }
  .tab.active { color: var(--primary); border-bottom-color: var(--primary); }
  
  .layers { flex: 1; overflow-y: auto; min-height: 120px; border-top: 1px solid var(--border-color); padding: 16px; background: #f9fafb; }
  .layers h3 { font-size: 12px; font-weight: 700; color: var(--text-muted); margin-bottom: 12px; text-transform: uppercase; }
  #layer-list { display: flex; flex-direction: column; gap: 6px; }
  .layer-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: #fff; border-radius: 8px; cursor: pointer; font-size: 13px; border: 1px solid transparent; }
  .layer-item.active { border-color: var(--primary); background: #f5f3ff; }
  .layer-item .layer-label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
  .layer-del { color: var(--text-muted); padding: 4px; }
  .layer-del:hover { color: var(--danger); }

  /* Toast */
  .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: #1f2937; color: #fff; padding: 12px 24px; border-radius: 30px; font-size: 14px; font-weight: 500; z-index: 10000; box-shadow: var(--shadow-lg); animation: slideUp 0.3s ease; }
  @keyframes slideUp { from { opacity: 0; transform: translate(-50%, 20px); } to { opacity: 1; transform: translate(-50%, 0); } }

  #floating-delete { position: fixed; display: none; z-index: 9999; width: 36px; height: 36px; background: var(--danger); color: #fff; border-radius: 50%; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4); cursor: pointer; align-items: center; justify-content: center; font-size: 16px; }
  
  /* ==========================================
     RESPONSIVE MOBILE (CHUẨN CANVA APP)
     ========================================== */
  @media (max-width: 768px) {
    .workspace-header { padding: 8px 12px; }
    #project-name-input { width: 120px; font-size: 14px; }
    
    /* Chuyển công cụ xuống dưới dạng thanh cuộn ngang */
    .workspace-main { flex-direction: column; }
    .left-tools { 
      width: 100%; height: auto; flex-direction: row; border-right: none; 
      border-top: 1px solid var(--border-color); padding: 8px 12px; overflow-x: auto; justify-content: flex-start; 
      gap: 8px; flex-shrink: 0; z-index: 20; padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
      scrollbar-width: none;
    }
    .left-tools::-webkit-scrollbar { display: none; }
    .tool-btn { width: 60px; height: 60px; flex-shrink: 0; background: var(--bg-body); }
    .tool-btn i { font-size: 22px; margin-bottom: 2px;}
    .tool-btn span { font-size: 11px; }

    /* Panel chuyển thành Bottom Sheet (Trượt từ dưới lên) */
    .right-panel {
      position: fixed; bottom: -100%; left: 0; right: 0; width: 100%; height: 60vh;
      border-left: none; border-top: 1px solid var(--border-color);
      border-radius: 24px 24px 0 0; box-shadow: 0 -10px 40px rgba(0,0,0,0.15);
      transition: bottom 0.3s cubic-bezier(0.16, 1, 0.3, 1); z-index: 100;
    }
    .right-panel.open { bottom: 0; }
    
    .panel-mobile-header { 
      display: flex; justify-content: space-between; align-items: center; 
      padding: 16px 20px; border-bottom: 1px solid var(--border-color); font-weight: 700; 
    }
    #btn-close-panel { font-size: 20px; color: var(--text-muted); }
    #panel-empty, #panel-object { max-height: calc(60vh - 60px); }
    
    /* Ẩn một số nút trên header mobile cho gọn */
    .header-center { display: none; } 
    .btn-download { display: none; } /* Đưa vào trong Panel hoặc giữ nút Lưu là đủ */
    
    /* Nút bật panel (Góc dưới bên phải giống Canva) */
    #btn-toggle-panel { display: flex; position: fixed; right: 16px; bottom: 80px; width: 50px; height: 50px; border-radius: 50%; background: var(--primary); color: #fff; box-shadow: var(--shadow-lg); z-index: 50; align-items: center; justify-content: center; font-size: 20px; }
  }
  
  @media (min-width: 769px) {
    #btn-toggle-panel { display: none; }
    .btn-close-panel { display: none; }
  }
</style>
</head>
<body>

<!-- Loading -->
<div id="screen-loading" class="screen"><i class="fas fa-spinner fa-spin" style="margin-right:8px;"></i> Đang tải...</div>

<!-- Auth -->
<div id="screen-auth" class="screen hidden">
  <div class="auth-card">
    <h1>Netizen Editor</h1>
    <p class="sub">Đăng nhập để bắt đầu sáng tạo</p>
    <label>Email của bạn</label>
    <input type="email" id="auth-email" placeholder="ban@example.com" autocomplete="email">
    <button id="btn-send-link">Gửi link đăng nhập</button>
    <div id="auth-msg"></div>
  </div>
</div>

<!-- Dashboard -->
<div id="screen-dashboard" class="screen hidden">
  <header class="dash-header">
    <div class="top-nav">
      <div class="logo"><i class="fas fa-bolt"></i> Netizen</div>
      <div class="user-profile">
        <span id="user-email"></span>
        <button id="btn-logout" class="btn-icon" title="Đăng xuất"><i class="fas fa-sign-out-alt"></i></button>
      </div>
    </div>
    <div class="search-bar">
      <i class="fas fa-search"></i>
      <input type="text" placeholder="Bạn muốn thiết kế gì hôm nay?">
    </div>
  </header>

  <main class="dash-content">
    <button id="btn-new-project" class="btn-create-main"><i class="fas fa-plus"></i> Tạo thiết kế mới</button>
    
    <div class="section-title">Dự án của bạn <span>Xem tất cả</span></div>
    <div id="loading-state" style="color:var(--text-muted); font-size:14px;">Đang tải...</div>
    <div id="project-grid"></div>
    <div id="empty-state" class="hidden">Chưa có thiết kế nào. Hãy tạo mới nhé!</div>
  </main>

  <!-- Bottom Nav Cho Mobile -->
  <nav class="bottom-nav">
    <div class="nav-item active"><i class="fas fa-home"></i> Trang chủ</div>
    <div class="nav-item"><i class="fas fa-folder"></i> Dự án</div>
    <div class="nav-item"><i class="fas fa-layer-group"></i> Mẫu</div>
    <div class="nav-item"><i class="fas fa-user"></i> Tài khoản</div>
  </nav>
</div>

<!-- Modal New Project -->
<div id="modal-new" class="modal hidden">
  <div class="modal-content">
    <h2>Tạo thiết kế mới</h2>
    <label>Tên thiết kế</label>
    <input id="new-name" type="text" placeholder="VD: Banner bán hàng, Avatar...">
    <label>Chọn kích thước</label>
    <div id="size-presets" class="size-grid"></div>
    <label>Hoặc tùy chỉnh (px)</label>
    <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 12px;">
      <input id="custom-w" type="number" value="1080" min="100" max="5000">
      <input id="custom-h" type="number" value="1080" min="100" max="5000">
    </div>
    <div class="modal-actions">
      <button id="btn-cancel-new">Hủy</button>
      <button id="btn-create-new">Tạo thiết kế</button>
    </div>
  </div>
</div>

<!-- Workspace (Editor) -->
<div id="screen-workspace" class="screen hidden">
  <header class="workspace-header">
    <div class="header-left">
      <button id="btn-back" class="btn-header" title="Về trang chủ"><i class="fas fa-arrow-left"></i></button>
      <input id="project-name-input" type="text">
      <span id="save-status">Đã lưu</span>
    </div>
    
    <!-- Undo/Redo (Chỉ hiện trên Desktop) -->
    <div class="header-center">
      <button id="btn-undo" class="btn-header" title="Hoàn tác"><i class="fas fa-undo"></i></button>
      <button id="btn-redo" class="btn-header" title="Làm lại"><i class="fas fa-redo"></i></button>
    </div>

    <div class="header-right">
      <button id="btn-save" class="btn-header" style="width: auto; background: var(--primary); color: #fff;">Lưu</button>
      <div class="dropdown">

function sanitizeFilename(s) {

/* ============================================================
   CANVAS & SMART GUIDES
============================================================ */
function initCanvas(project) {
  const el = $('c');
  el.width = project.width;
  el.height = project.height;

  canvas = new fabric.Canvas('c', {
    width: project.width,
    height: project.height,
    backgroundColor: project.background || '#ffffff',
    preserveObjectStacking: true,
    selection: true,
    enableRetinaScaling: false
  });
  
  enableSmartGuides(canvas);

  history = []; historyIndex = -1;
  isRestoring = true;

  if (project.data) {
    canvas.loadFromJSON(project.data, () => {
      const loadPromises = [];

      if (canvas.backgroundImage) {
        loadPromises.push(new Promise(resolve => {
          const bgSrc = canvas.backgroundImage.getSrc();
          if (!bgSrc) return resolve();
          canvas.backgroundImage.setSrc(bgSrc, () => resolve(), { crossOrigin: 'anonymous' });
        }));
      }

      canvas.getObjects().forEach(obj => {
        if (obj.type === 'image') {
          const imgSrc = obj.getSrc();
          if (imgSrc) {
            const savedAngle = obj.angle, savedScaleX = obj.scaleX, savedScaleY = obj.scaleY, savedLeft = obj.left, savedTop = obj.top;
            loadPromises.push(new Promise(resolve => {
              obj.setSrc(imgSrc, () => {
                obj.set({ angle: savedAngle, scaleX: savedScaleX, scaleY: savedScaleY, left: savedLeft, top: savedTop });
                obj.setCoords();
                resolve();
              }, { crossOrigin: 'anonymous' });
            }));
          }
        }
      });

      Promise.all(loadPromises).then(() => {
        canvas.calcOffset();
        canvas.renderAll();
        isRestoring = false;
        saveHistory(); refreshLayers(); updateObjectPanel();
        updateFloatingDelete();
        setTimeout(fitToScreen, 200); 
      });
    });
  } else {
    isRestoring = false;
    if (project.name.includes('Bi') || (project.width === 828 && project.height === 1792 && project.name.includes('A'))) {
      applyTikTokTemplate();
    } else {
      saveHistory();
    }
    setTimeout(fitToScreen, 200);
  }

  canvas.on('selection:created', () => { updateObjectPanel(); refreshLayers(); updateFloatingDelete(); });
  canvas.on('selection:updated', () => { updateObjectPanel(); refreshLayers(); updateFloatingDelete(); });
  canvas.on('selection:cleared', () => { updateObjectPanel(); refreshLayers(); $('floating-delete').style.display = 'none'; });
  
  canvas.on('object:moving', updateFloatingDelete);
  canvas.on('object:scaling', updateFloatingDelete);
  canvas.on('object:rotating', updateFloatingDelete);
  canvas.on('object:modified', () => {
    if (!isRestoring) { saveHistory(); markUnsaved(); }
    updateObjectPanel();
    updateFloatingDelete();
  });
  
  $('canvas-scroll').addEventListener('scroll', updateFloatingDelete);

  canvas.on('mouse:wheel', function(opt) {
    var delta = opt.e.deltaY;
    var zoom = canvas.getZoom();
    zoom *= 0.999 ** delta;
    if (zoom > 4) zoom = 4;
    if (zoom < 0.05) zoom = 0.05;
    canvas.zoomToPoint({ x: opt.e.offsetX, y: opt.e.offsetY }, zoom);
    currentZoom = zoom;
    updateFloatingDelete();
    opt.e.preventDefault();
    opt.e.stopPropagation();
  });
}

window.addEventListener('resize', () => {
  if (canvas) {
    fitToScreen();
    canvas.calcOffset();
  }
});

function enableSmartGuides(c) {
  const ctx = c.contextTop;
  let lines = [];
  const snapThreshold = 8;

  c.on('object:moving', function(e) {
    const obj = e.target;
    if (!obj) return;
    c.clearContext(c.contextTop);
    lines = [];

    const zoom = c.getZoom();
    const canvasW = currentProject ? currentProject.width : c.width / zoom;
    const canvasH = currentProject ? currentProject.height : c.height / zoom;

    const objBox = obj.getBoundingRect();
    let targetsX = [0, canvasW / 2, canvasW];
    let targetsY = [0, canvasH / 2, canvasH];

    c.getObjects().forEach(o => {
      if (o === obj || o.type === 'activeSelection') return;
      const b = o.getBoundingRect();
      targetsX.push(b.left, b.left + b.width / 2, b.left + b.width);
      targetsY.push(b.top, b.top + b.height / 2, b.top + b.height);
    });

    const objXPoints = [objBox.left, objBox.left + objBox.width / 2, objBox.left + objBox.width];
    const objYPoints = [objBox.top, objBox.top + objBox.height / 2, objBox.top + objBox.height];

    let bestSnapX = { dist: snapThreshold / zoom, target: null, objPoint: null };
    let bestSnapY = { dist: snapThreshold / zoom, target: null, objPoint: null };

    for (let i = 0; i < objXPoints.length; i++) {
      for (let j = 0; j < targetsX.length; j++) {
        const dist = Math.abs(objXPoints[i] - targetsX[j]);
        if (dist < bestSnapX.dist) bestSnapX = { dist, target: targetsX[j], objPoint: objXPoints[i] };
      }
    }
    for (let i = 0; i < objYPoints.length; i++) {
      for (let j = 0; j < targetsY.length; j++) {
        const dist = Math.abs(objYPoints[i] - targetsY[j]);
        if (dist < bestSnapY.dist) bestSnapY = { dist, target: targetsY[j], objPoint: objYPoints[i] };
      }
    }

    if (bestSnapX.target !== null) {
      obj.left += (bestSnapX.target - bestSnapX.objPoint);
      lines.push({ x1: bestSnapX.target, y1: 0, x2: bestSnapX.target, y2: canvasH, type: 'v' });
    }
    if (bestSnapY.target !== null) {
      obj.top += (bestSnapY.target - bestSnapY.objPoint);
      lines.push({ x1: 0, y1: bestSnapY.target, x2: canvasW, y2: bestSnapY.target, type: 'h' });
    }
    if (bestSnapX.target !== null || bestSnapY.target !== null) obj.setCoords();
  });

  c.on('mouse:up', function() {
    lines = [];
    c.clearContext(c.contextTop);
    c.requestRenderAll();
  });

  c.on('after:render', function() {
    if (lines.length > 0) {
      ctx.save();
      const zoom = c.getZoom();
      lines.forEach(line => {
        ctx.beginPath();
        if (line.type === 'v') {
          ctx.moveTo(line.x1 * zoom, 0);
          ctx.lineTo(line.x1 * zoom, c.getHeight());
        } else {
          ctx.moveTo(0, line.y1 * zoom);
          ctx.lineTo(c.getWidth(), line.y1 * zoom);
        }
        ctx.strokeStyle = '#8b5cf6'; 
        ctx.lineWidth = 1.5; 
        ctx.setLineDash([6, 4]); 
        ctx.stroke();
      });
      ctx.restore();
    }
  });
}

/* ============================================================
   LOGIC NÚT XÓA NỔI
============================================================ */
const floatingDelete = document.getElementById('floating-delete');

function updateFloatingDelete() {
  const activeObj = canvas.getActiveObject();
  if (!activeObj || activeObj.isEditing) {
    floatingDelete.style.display = 'none';
    return;
  }

  const coords = activeObj.oCoords.tr; 
  const canvasRect = canvas.upperCanvasEl.getBoundingClientRect();

  const left = canvasRect.left + coords.x + 10;
  const top = canvasRect.top + coords.y - 18;

  if (top < 60) {
    const bottomCoords = activeObj.oCoords.br;
    floatingDelete.style.top = `${canvasRect.top + bottomCoords.y + 10}px`;
    floatingDelete.style.left = `${canvasRect.left + bottomCoords.x - 18}px`;
  } else {
    floatingDelete.style.left = `${left}px`;
    floatingDelete.style.top = `${top}px`;
  }

  floatingDelete.style.display = 'flex';
}

floatingDelete.addEventListener('click', (e) => {
  e.preventDefault();
  e.stopPropagation();
  const activeObj = canvas.getActiveObject();
  if (activeObj) {
    if (activeObj.type === 'activeSelection') {
      activeObj.forEachObject(o => canvas.remove(o));
      canvas.discardActiveObject();
    } else {
      canvas.remove(activeObj);
    }
    floatingDelete.style.display = 'none';
    canvas.requestRenderAll();
    saveHistory();
    markUnsaved();
    updateObjectPanel();
    refreshLayers();
  }
});

canvas.on('mouse:dblclick', (e) => {
  const obj = e.target;
  if (obj && obj.type === 'group') {
    obj.toActiveSelection();
    canvas.requestRenderAll();
    toast('Đã tách nhóm!', 'success');
  }
});

/* ============================================================
   CÁC HÀM XỬ LÝ KHÁC
============================================================ */

function saveHistory() {
  if (isRestoring || !canvas) return;
  const json = canvas.toJSON(['id', 'name']);
  if (historyIndex >= 0) {
    if (JSON.stringify(history[historyIndex]) === JSON.stringify(json)) return;
  }
  history = history.slice(0, historyIndex + 1);
  history.push(json);
  if (history.length > 60) history.shift();
  historyIndex = history.length - 1;
  updateUndoRedo();
}
function undo() { if (historyIndex <= 0) return; historyIndex--; restoreHistory(); }
function redo() { if (historyIndex >= history.length - 1) return; historyIndex++; restoreHistory(); }
function restoreHistory() {
  isRestoring = true;
  canvas.loadFromJSON(history[historyIndex], () => {
    canvas.renderAll();
    isRestoring = false;
    updateUndoRedo(); updateObjectPanel(); refreshLayers(); markUnsaved(); updateFloatingDelete();
  });
}
function updateUndoRedo() {
  $('btn-undo').disabled = historyIndex <= 0;
  $('btn-redo').disabled = historyIndex >= history.length - 1;
}

function markUnsaved() {
  dirty = true;
  $('save-status').textContent = 'Đang lưu...';
  $('save-status').style.display = 'inline';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => saveCurrentProject(true), 2000);
}

async function saveCurrentProject(silent = false) {
  if (!currentProject || !canvas) return;
  clearTimeout(saveTimer);
  const json = canvas.toJSON(['id', 'name']);
  const name = $('project-name-input').value.trim() || currentProject.name;
  const background = (typeof canvas.backgroundColor === 'string') ? canvas.backgroundColor : '#ffffff';
  $('save-status').textContent = 'Đang lưu...';
  $('save-status').style.display = 'inline';

  const { error } = await sb.from('projects').update({ name, background, data: json, updated_at: new Date().toISOString() }).eq('id', currentProject.id);
  if (error) {
    $('save-status').textContent = 'Lỗi lưu';
    if (!silent) toast('Lỗi lưu: ' + error.message, 'error');
    return;
  }
  currentProject.name = name; currentProject.background = background; dirty = false;
  $('save-status').textContent = 'Đã lưu';
  setTimeout(() => { if (!dirty) { $('save-status').style.display = 'none'; } }, 1500);
}

$('btn-save').addEventListener('click', () => saveCurrentProject(false));
$('project-name-input').addEventListener('input', () => markUnsaved());

function applyZoom(z) {
  if (!canvas || !currentProject) return;
  currentZoom = Math.max(0.05, Math.min(4, z));
  canvas.setZoom(currentZoom);
  canvas.setDimensions({ width: currentProject.width * currentZoom, height: currentProject.height * currentZoom }); 
  canvas.renderAll();
  updateFloatingDelete();
}
function fitToScreen() {
  if (!canvas || !currentProject) return;
  const scroll = $('canvas-scroll');
  const aw = scroll.clientWidth - 40, ah = scroll.clientHeight - 40;
  if (aw <= 0 || ah <= 0) return;
  applyZoom(Math.min(aw / currentProject.width, ah / currentProject.height, 1));
}
$('btn-zoom-in').addEventListener('click', () => applyZoom(currentZoom * 1.15));
$('btn-zoom-out').addEventListener('click', () => applyZoom(currentZoom / 1.15));
$('btn-undo').addEventListener('click', undo);
$('btn-redo').addEventListener('click', redo);

function addText() {
  const t = new fabric.Textbox('Nhập văn bản', {
    left: canvas.getWidth() / 2, top: canvas.getHeight() / 2, originX: 'center', originY: 'center',
    fontSize: 40, fontFamily: 'Inter', fill: '#1f2937', width: 400, textAlign: 'center', splitByGrapheme: true
  });
  canvas.add(t); canvas.setActiveObject(t); canvas.renderAll();
  saveHistory(); markUnsaved();
}

function getStarPoints(spikes, outerR, innerR) {
  const pts = [];
  for (let i = 0; i < spikes * 2; i++) {
    const r = i % 2 === 0 ? outerR : innerR;
    const a = (Math.PI / spikes) * i - Math.PI / 2;
    pts.push({ x: Math.cos(a) * r, y: Math.sin(a) * r });
  }
  return pts;
}

function addShape(type) {
  const cx = canvas.getWidth() / 2, cy = canvas.getHeight() / 2;
  const opts = { left: cx, top: cy, originX: 'center', originY: 'center', fill: '#3b82f6' };
  let shape;
  if (type === 'rect') shape = new fabric.Rect({ ...opts, width: 240, height: 160 });
  else if (type === 'circle') shape = new fabric.Circle({ ...opts, radius: 110 });
  else if (type === 'triangle') shape = new fabric.Triangle({ ...opts, width: 200, height: 180 });
  else if (type === 'star') shape = new fabric.Polygon(getStarPoints(5, 110, 48), { ...opts });
  else if (type === 'line') shape = new fabric.Line([cx - 120, cy, cx + 120, cy], { stroke: '#1f2937', strokeWidth: 4 });
  if (shape) { canvas.add(shape); canvas.setActiveObject(shape); canvas.renderAll(); saveHistory(); markUnsaved(); }
}

document.querySelectorAll('.left-tools button').forEach(b => {
  b.addEventListener('click', () => {
    const t = b.dataset.tool;
    if (t === 'text') addText();
    else if (t === 'image') $('file-image').click();
    else if (t === 'statusbar') addStatusBar();
    else addShape(t);
  });
});

$('file-image').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  const uploadBtn = document.querySelector('.left-tools button[data-tool="image"]');
  uploadBtn.style.opacity = '0.5';
  toast('Đang tải ảnh lên...');
  try {
    const publicUrl = await uploadImageToStorage(file);
    await addImageToCanvas(publicUrl);
    toast('Đã thêm ảnh', 'success');
  } catch (err) {
    toast('Lỗi upload: ' + err.message, 'error');
  } finally {
    uploadBtn.style.opacity = '1';
  }
});

async function uploadImageToStorage(file) {
  if (file.size > 5 * 1024 * 1024) throw new Error('Ảnh quá lớn (giới hạn 5MB)');
  const ext = (file.name.split('.').pop() || 'png').toLowerCase();
  const path = `${currentUser.id}/${uid()}.${ext}`;
  const { error } = await sb.storage.from(STORAGE_BUCKET).upload(path, file, { contentType: file.type, upsert: false });
  if (error) throw error;
  const { data } = sb.storage.from(STORAGE_BUCKET).getPublicUrl(path);
  return data.publicUrl;
}

function addImageToCanvas(url) {
  return new Promise((resolve, reject) => {
    fabric.Image.fromURL(url, (img) => {
      if (!img.width || !img.height) { reject(new Error('Ảnh không hợp lệ')); return; }
      const maxW = canvas.getWidth() * 0.6, maxH = canvas.getHeight() * 0.6;
      const s = Math.min(maxW / img.width, maxH / img.height, 1);
      img.set({ scaleX: s, scaleY: s, left: canvas.getWidth() / 2, top: canvas.getHeight() / 2, originX: 'center', originY: 'center' });
      canvas.add(img); canvas.setActiveObject(img); canvas.renderAll(); 
      saveHistory(); markUnsaved();
      resolve();
    }, { crossOrigin: 'anonymous' });
  });
}

function normalizeColor(c) {
  if (typeof c !== 'string') return '#000000';
  if (/^#[0-9a-f]{6}$/i.test(c)) return c;
  if (/^#[0-9a-f]{3}$/i.test(c)) return '#' + c[1]+c[1]+c[2]+c[2]+c[3]+c[3];
  return '#000000';
}

function updateObjectPanel() {
  if (!canvas) return;
  const obj = canvas.getActiveObject();
  const pEmpty = $('panel-empty'), pObj = $('panel-object');
  if (!obj || obj.type === 'activeSelection') {
    pEmpty.style.display = 'block'; pObj.classList.add('hidden'); return;
  }
  pEmpty.style.display = 'none'; pObj.classList.remove('hidden');

  const isText = ['textbox','i-text','text'].includes(obj.type);
  $('text-fields').style.display = isText ? 'block' : 'none';
  $('field-color').style.display = isText ? 'none' : 'block';
  $('obj-color').value = normalizeColor(obj.fill || '#000000');

  if (isText) {
    $('font-family').value = obj.fontFamily || 'Inter';
    $('font-size').value = obj.fontSize || 32;
    $('btn-bold').classList.toggle('active', obj.fontWeight === 'bold');
    $('btn-italic').classList.toggle('active', obj.fontStyle === 'italic');
    $('btn-underline').classList.toggle('active', !!obj.underline);
    document.querySelectorAll('[data-align]').forEach(b =>
      b.classList.toggle('active', obj.textAlign === b.dataset.align));
  }
  const op = Math.round((obj.opacity ?? 1) * 100);
  $('obj-opacity').value = op; $('opacity-val').textContent = op;
  $('pos-x').value = Math.round(obj.left || 0);
  $('pos-y').value = Math.round(obj.top || 0);
  $('pos-w').value = Math.round((obj.width || 0) * (obj.scaleX || 1));
  $('pos-h').value = Math.round((obj.height || 0) * (obj.scaleY || 1));
  $('pos-angle').value = Math.round(obj.angle || 0);
}

const getActive = () => canvas && canvas.getActiveObject();
const refresh = () => { if (canvas) { canvas.renderAll(); saveHistory(); markUnsaved(); updateObjectPanel(); } };

$('bg-color').addEventListener('input', (e) => {
  if (!canvas) return;
  canvas.setBackgroundColor(e.target.value, () => canvas.renderAll());
  markUnsaved();
});

document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
    document.querySelector(`[data-tab-content="${t.dataset.tab}"]`).classList.remove('hidden');
  });
});

$('obj-color').addEventListener('input', e => {
  const o = getActive(); if (!o) return;
  o.set('fill', e.target.value); canvas.renderAll();
});
$('obj-color').addEventListener('change', () => { saveHistory(); markUnsaved(); });

$('font-family').addEventListener('change', e => {
  const o = getActive(); if (!o) return;
  o.set('fontFamily', e.target.value);
  if (document.fonts) document.fonts.load(`${o.fontSize || 32}px "${e.target.value}"`);
  refresh();
});
$('font-size').addEventListener('input', e => {
  const o = getActive(); if (!o) return;
  o.set('fontSize', parseInt(e.target.value) || 12); canvas.renderAll();
});
$('font-size').addEventListener('change', () => { saveHistory(); markUnsaved(); });

$('btn-bold').addEventListener('click', () => {
  const o = getActive(); if (!o) return;
  o.set('fontWeight', o.fontWeight === 'bold' ? 'normal' : 'bold'); refresh();
});
$('btn-italic').addEventListener('click', () => {
  const o = getActive(); if (!o) return;
  o.set('fontStyle', o.fontStyle === 'italic' ? 'normal' : 'italic'); refresh();
});
$('btn-underline').addEventListener('click', () => {
  const o = getActive(); if (!o) return;
  o.set('underline', !o.underline); refresh();
});
document.querySelectorAll('[data-align]').forEach(b => {
  b.addEventListener('click', () => {
    const o = getActive(); if (!o) return;
    o.set('textAlign', b.dataset.align); refresh();
  });
});

$('obj-opacity').addEventListener('input', e => {
  const o = getActive(); if (!o) return;
  o.set('opacity', parseInt(e.target.value) / 100);
  $('opacity-val').textContent = e.target.value;
  canvas.renderAll();
});
$('obj-opacity').addEventListener('change', () => { saveHistory(); markUnsaved(); });

$('btn-forward').addEventListener('click', () => { const o = getActive(); if (o) { canvas.bringForward(o); refresh(); }});
$('btn-backward').addEventListener('click', () => { const o = getActive(); if (o) { canvas.sendBackwards(o); refresh(); }});

['pos-x','pos-y','pos-w','pos-h','pos-angle'].forEach(id => {
  $(id).addEventListener('change', e => {
    const o = getActive(); if (!o) return;
    const v = parseFloat(e.target.value) || 0;
    if (id === 'pos-x') o.set('left', v);
    else if (id === 'pos-y') o.set('top', v);
    else if (id === 'pos-w') o.set('scaleX', v / (o.width || 1));
    else if (id === 'pos-h') o.set('scaleY', v / (o.height || 1));
    else if (id === 'pos-angle') o.set('angle', v);
    canvas.renderAll(); saveHistory(); markUnsaved();
  });
});

$('btn-duplicate').addEventListener('click', () => {
  const o = getActive(); if (!o) return;
  o.clone(c => {
    c.set({ left: (o.left || 0) + 24, top: (o.top || 0) + 24 });
    canvas.add(c); canvas.setActiveObject(c); canvas.renderAll();
    saveHistory(); markUnsaved();
  });
});
$('btn-delete').addEventListener('click', () => {
  const o = getActive(); if (!o) return;
  canvas.remove(o); canvas.discardActiveObject(); canvas.renderAll();
  floatingDelete.style.display = 'none';
  saveHistory(); markUnsaved(); refreshLayers();
});

function refreshLayers() {
  const list = $('layer-list');
  if (!canvas) { list.innerHTML = ''; return; }
  list.innerHTML = '';
  const objects = canvas.getObjects();
  const active = canvas.getActiveObject();
  for (let i = objects.length - 1; i >= 0; i--) {
    const obj = objects[i];
    const div = document.createElement('div');
    div.className = 'layer-item' + (obj === active ? ' active' : '');
    let icon = 'fa-square';
    if (['textbox','i-text','text'].includes(obj.type)) { icon = 'fa-font'; }
    else if (obj.type === 'image') { icon = 'fa-image'; }
    else if (obj.type === 'circle') { icon = 'fa-circle'; }
    else if (obj.type === 'triangle') { icon = 'fa-play'; }

    let label = obj.name || obj.type;
    if (obj.type === 'textbox' || obj.type === 'i-text') label = obj.text.substring(0,20) || 'Text';
    else if (obj.type === 'image') label = 'Hình ảnh';
    else if (obj.type === 'rect') label = 'Hình chữ nhật';
    else if (obj.type === 'circle') label = 'Hình tròn';
    else if (obj.type === 'triangle') label = 'Tam giác';

    div.innerHTML = `<div style="display:flex; align-items:center; gap:8px; flex:1; overflow:hidden;">
        <i class="fas ${icon}" style="color:#9ca3af; width:14px; text-align:center;"></i>
        <span class="layer-label">${escapeHtml(label)}</span>
      </div>
      <button class="layer-del" title="Xóa"><i class="fas fa-trash"></i></button>`;
    
    div.addEventListener('click', (e) => {
      if (e.target.closest('.layer-del')) return;
      canvas.setActiveObject(obj); canvas.renderAll();
      updateObjectPanel(); refreshLayers();
    });
    div.querySelector('.layer-del').addEventListener('click', (e) => {
      e.stopPropagation();
      canvas.remove(obj); canvas.renderAll(); saveHistory(); markUnsaved();
    });
    list.appendChild(div);
  }
}

$('btn-download').addEventListener('click', (e) => {
  e.stopPropagation();
  $('download-menu').classList.toggle('hidden');
});
document.addEventListener('click', () => $('download-menu').classList.add('hidden'));

$('download-menu').querySelectorAll('button').forEach(b => {
  b.addEventListener('click', () => {
    downloadImage(b.dataset.format, b.dataset.quality, parseInt(b.dataset.scale));
    $('download-menu').classList.add('hidden');
  });
});

function downloadImage(format, quality, scale) {
  if (!canvas || !currentProject) return;
  try {
    const oldZoom = canvas.getZoom(), oldWidth = canvas.getWidth(), oldHeight = canvas.getHeight();
    canvas.setZoom(1);
    canvas.setDimensions({ width: currentProject.width, height: currentProject.height });
    canvas.renderAll();

    const dataURL = canvas.toDataURL({ format: format === 'jpeg' ? 'jpeg' : 'png', quality: parseFloat(quality) || 1, multiplier: scale });

    canvas.setZoom(oldZoom);
    canvas.setDimensions({ width: oldWidth, height: oldHeight });
    canvas.renderAll();

    const a = document.createElement('a');
    a.download = `${sanitizeFilename(currentProject.name)}.${format}`;
    a.href = dataURL;
    a.click();
    toast('Đã tải xuống', 'success');
  } catch (err) {
    toast('Lỗi xuất ảnh: ' + err.message, 'error');
  }
}

document.addEventListener('keydown', (e) => {
  if (!canvas) return;
  const tag = (e.target.tagName || '').toLowerCase();
  if (['input','textarea','select'].includes(tag) || e.target.isContentEditable) return;
  const active = canvas.getActiveObject();
  if (active && active.isEditing) return;

  if (e.key === 'Delete' || e.key === 'Backspace') {
    if (active) {
      if (active.type === 'activeSelection') {
        active.forEachObject(o => canvas.remove(o));
        canvas.discardActiveObject();
      } else canvas.remove(active);
      canvas.renderAll();
      floatingDelete.style.display = 'none';
      saveHistory(); markUnsaved(); refreshLayers();
      e.preventDefault();
    }
  } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
    e.preventDefault(); e.shiftKey ? redo() : undo();
  } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') {
    e.preventDefault(); redo();
  } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'd') {
    e.preventDefault(); $('btn-duplicate').click();
  } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
    e.preventDefault(); saveCurrentProject(false);
  }
});

window.addEventListener('beforeunload', (e) => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
document.fonts.ready.then(() => { if (canvas) canvas.renderAll(); });
