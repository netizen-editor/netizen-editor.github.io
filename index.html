<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Netizen Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fabric@5.3.0/dist/fabric.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  /* =========================================
     HỆ THỐNG MÀU SẮC (Hỗ trợ Light/Dark Mode)
     ========================================= */
  :root {
    --bg-body: #f8fafc;
    --bg-panel: #ffffff;
    --bg-toolbar: #ffffff;
    --text-main: #1e293b;
    --text-muted: #64748b;
    --border-color: #e2e8f0;
    --primary: #8b5cf6; /* Tím Canva */
    --primary-hover: #7c3aed;
    --danger: #ef4444;
    --success: #10b981;
    --canvas-bg: #e2e8f0;
    --shadow-sm: 0 1px 3px 0 rgb(0 0 0 / 0.1);
    --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
    --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg-body: #0f172a;
      --bg-panel: #1e293b;
      --bg-toolbar: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --canvas-bg: #020617;
      --shadow-sm: 0 1px 3px 0 rgb(0 0 0 / 0.5);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.5);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.5);
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: 'Inter', sans-serif; background: var(--bg-body); color: var(--text-main); height: 100vh; height: 100dvh; overflow: hidden; transition: background 0.3s, color 0.3s; }
  button { cursor: pointer; font-family: inherit; border: none; background: none; touch-action: manipulation; transition: all 0.2s; }
  input, select { font-family: inherit; touch-action: manipulation; color: var(--text-main); background: var(--bg-panel); border: 1px solid var(--border-color); }
  .hidden { display: none !important; }
  .screen { height: 100vh; height: 100dvh; overflow: hidden; }

  /* Auth */
  #screen-loading, #screen-auth {
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, var(--primary) 0%, #3b82f6 100%); padding: 20px;
  }
  #screen-loading { color: #fff; font-size: 18px; }
  .auth-card { background: var(--bg-panel); padding: 32px; border-radius: 16px; width: 400px; max-width: 100%; box-shadow: var(--shadow-lg); }
  .auth-card h1 { font-size: 24px; color: var(--primary); margin-bottom: 8px; text-align: center; font-weight: 700; }
  .auth-card .sub { color: var(--text-muted); font-size: 14px; text-align: center; margin-bottom: 24px; }
  .auth-card label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; }
  .auth-card input { width: 100%; padding: 12px 14px; border-radius: 8px; font-size: 14px; margin-bottom: 16px; outline: none; }
  .auth-card input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2); }
  .auth-card button { width: 100%; padding: 12px; background: var(--primary); color: #fff; border-radius: 8px; font-weight: 600; font-size: 15px; }
  .auth-card button:hover { background: var(--primary-hover); }
  #auth-msg { font-size: 13px; text-align: center; margin-top: 14px; min-height: 20px; color: var(--success); font-weight: 500; }
  #auth-msg.error { color: var(--danger); }

  /* Dashboard */
  #screen-dashboard { overflow-y: auto; }
  #screen-dashboard header { 
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;
    padding: 16px 24px; background: var(--bg-panel); border-bottom: 1px solid var(--border-color); 
    position: sticky; top: 0; z-index: 10; gap: 16px; box-shadow: var(--shadow-sm);
  }
  #screen-dashboard h1 { font-size: 20px; color: var(--primary); font-weight: 700; }
  .header-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  #user-email { font-size: 13px; color: var(--text-muted); max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: var(--bg-body); padding: 6px 12px; border-radius: 20px; }
  #btn-logout { padding: 8px 16px; border-radius: 8px; font-size: 14px; font-weight: 500; color: var(--text-main); border: 1px solid var(--border-color); background: var(--bg-panel); }
  #btn-logout:hover { background: var(--bg-body); }
  #btn-new-project { background: var(--primary); color: #fff; padding: 8px 16px; border-radius: 8px; font-weight: 600; font-size: 14px; white-space: nowrap; box-shadow: var(--shadow-sm); }
  #btn-new-project:hover { background: var(--primary-hover); transform: translateY(-1px); }
  
  #dashboard-main { padding: 24px; max-width: 1400px; margin: 0 auto; }
  #project-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }
  .project-card { background: var(--bg-panel); border-radius: 12px; overflow: hidden; cursor: pointer; border: 1px solid var(--border-color); transition: all 0.2s; position: relative; box-shadow: var(--shadow-sm); display: flex; flex-direction: column; }
  .project-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); border-color: var(--primary); }
  .project-card .thumb { aspect-ratio: 16/9; display: flex; align-items: center; justify-content: center; font-size: 36px; font-weight: 700; color: rgba(255,255,255,0.9); background: var(--bg-body); position: relative; overflow: hidden;}
  .project-card .thumb::before { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(0,0,0,0.2)); }
  .project-card .info { padding: 16px; flex: 1; z-index: 2; background: var(--bg-panel); }
  .project-card .name { font-weight: 600; font-size: 15px; margin-bottom: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .project-card .meta { color: var(--text-muted); font-size: 13px; }
  .project-card .delete-btn { position: absolute; top: 10px; right: 10px; width: 28px; height: 28px; border-radius: 50%; background: rgba(0,0,0,0.5); color: #fff; font-weight: bold; opacity: 0; transition: opacity 0.2s; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px); z-index: 3;}
  .project-card:hover .delete-btn { opacity: 1; }
  .project-card .delete-btn:hover { background: var(--danger); transform: scale(1.1); }
  
  #empty-state { color: var(--text-muted); text-align: center; padding: 80px 0; font-size: 15px; }
  #loading-state { color: var(--text-muted); text-align: center; padding: 60px 0; font-size: 15px; }

  /* Modal */
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px; backdrop-filter: blur(2px); }
  .modal-content { background: var(--bg-panel); border-radius: 16px; padding: 28px; width: 640px; max-width: 100%; max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow-lg); }
  .modal-content h2 { margin-bottom: 20px; font-size: 22px; font-weight: 700; }
  .modal-content label { display: block; font-size: 13px; font-weight: 600; color: var(--text-muted); margin: 16px 0 8px; }
  .modal-content input[type=text], .modal-content input[type=number] { width: 100%; padding: 10px 14px; border-radius: 8px; font-size: 14px; outline: none; }
  .modal-content input:focus { border-color: var(--primary); }
  .size-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  @media(max-width: 500px) { .size-grid { grid-template-columns: repeat(2, 1fr); } }
  .size-btn { padding: 16px 8px; border: 2px solid var(--border-color); border-radius: 10px; background: var(--bg-panel); text-align: center; font-size: 13px; font-weight: 500; color: var(--text-main); transition: all 0.2s; }
  .size-btn:hover { border-color: var(--primary); background: rgba(139, 92, 246, 0.05); }
  .size-btn.active { border-color: var(--primary); background: rgba(139, 92, 246, 0.1); color: var(--primary); font-weight: 700; }
  .size-btn .preview { background: linear-gradient(135deg, #cbd5e1, #94a3b8); border-radius: 6px; margin: 0 auto 10px; box-shadow: var(--shadow-sm); }
  .size-btn .dim { color: var(--text-muted); font-size: 11px; margin-top: 4px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 28px; }
  .modal-actions button { padding: 10px 20px; border-radius: 8px; font-weight: 600; font-size: 15px; }
  #btn-cancel-new { background: var(--bg-body); color: var(--text-main); }
  #btn-cancel-new:hover { background: var(--border-color); }
  #btn-create-new { background: var(--primary); color: #fff; }
  #btn-create-new:hover { background: var(--primary-hover); }
  .custom-size { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  /* =========================================
     WORKSPACE LAYOUT
     ========================================= */
  #screen-workspace { display: flex; flex-direction: column; background: var(--bg-body); height: 100vh; height: 100dvh; overflow: hidden; }
  
  .workspace-header { 
    flex-shrink: 0; background: var(--bg-panel); border-bottom: 1px solid var(--border-color);
    display: flex; align-items: center; justify-content: space-between; padding: 0 16px; gap: 16px; z-index: 20; box-shadow: var(--shadow-sm); min-height: 56px;
  }
  .workspace-header .left, .workspace-header .center, .workspace-header .right { display: flex; align-items: center; gap: 8px; }
  .workspace-header button { padding: 8px 12px; border-radius: 8px; color: var(--text-main); font-size: 14px; font-weight: 500; display: flex; align-items: center; justify-content: center; }
  .workspace-header button:hover:not(:disabled) { background: var(--bg-body); }
  .workspace-header button:disabled { opacity: 0.3; cursor: not-allowed; }
  #project-name-input { padding: 8px 12px; border: 1px solid transparent; border-radius: 6px; font-weight: 600; font-size: 15px; background: transparent; width: 160px; color: var(--text-main); transition: all 0.2s; }
  #project-name-input:hover, #project-name-input:focus { border-color: var(--border-color); background: var(--bg-body); outline: none; }
  #save-status { font-size: 12px; color: var(--text-muted); font-weight: 500; display: none; }
  .sep { color: var(--border-color); font-weight: 300; }
  #zoom-label { min-width: 48px; text-align: center; font-size: 13px; font-weight: 600; color: var(--text-muted); }
  
  #btn-save { background: var(--primary); color: #fff !important; padding: 8px 20px !important; font-weight: 600; box-shadow: var(--shadow-sm); border-radius: 8px; }
  #btn-save:hover { background: var(--primary-hover); }
  
  .dropdown { position: relative; }
  #btn-download { border: 1px solid var(--border-color); background: var(--bg-panel); border-radius: 8px; padding: 8px 16px !important; display: flex; align-items: center; gap: 6px; }
  .dropdown-menu { position: absolute; top: calc(100% + 4px); right: 0; background: var(--bg-panel);
    border: 1px solid var(--border-color); border-radius: 12px; box-shadow: var(--shadow-lg);
    min-width: 220px; z-index: 100; padding: 8px; }
  .dropdown-menu button { display: flex; align-items: center; width: 100%; text-align: left; padding: 10px 14px;
    font-size: 14px; border-radius: 8px; color: var(--text-main) !important; font-weight: 500; gap: 8px;}
  .dropdown-menu button:hover { background: var(--bg-body); }

  /* Vùng Main chia làm 3 cột (Tools - Canvas - Panel) */
  .workspace-main { flex: 1; display: flex; overflow: hidden; position: relative; width: 100%; }
  
  /* Toolbars Desktop */
  .left-tools { width: 72px; background: var(--bg-panel); border-right: 1px solid var(--border-color);
    display: flex; flex-direction: column; align-items: center; padding: 16px 0; gap: 12px; z-index: 10; overflow-y: auto; flex-shrink: 0; }
  .left-tools button { width: 56px; height: 56px; border-radius: 12px; font-size: 20px;
    color: var(--text-muted); display: flex; flex-direction: column; align-items: center; justify-content: center; flex-shrink: 0; gap: 4px;}
  .left-tools button svg { width: 24px; height: 24px; fill: currentColor; }
  .left-tools button span { font-size: 11px; font-weight: 500; }
  .left-tools button:hover { background: rgba(139, 92, 246, 0.1); color: var(--primary); }
  .left-tools button.active { background: var(--primary); color: #fff; }
  
  /* Vùng Canvas */
  .canvas-area { flex: 1; background: var(--canvas-bg); display: flex; overflow: hidden; position: relative; }
  #canvas-scroll { flex: 1; width: 100%; height: 100%; overflow: auto; display: flex; overscroll-behavior: contain; }
  #canvas-inner { margin: auto; padding: 40px; display: flex; align-items: center; justify-content: center; min-width: 100%; min-height: 100%; }
  #canvas-wrap { box-shadow: 0 4px 20px rgba(0,0,0,0.15); background: #fff; border-radius: 2px; }
  #c { display: block; }

  /* Right Panel */
  .right-panel { width: 320px; background: var(--bg-panel); border-left: 1px solid var(--border-color);
    display: flex; flex-direction: column; overflow: hidden; z-index: 15; box-shadow: -4px 0 15px rgba(0,0,0,0.03); flex-shrink: 0; }
  .panel-mobile-header { display: none; }

  #panel-empty, #panel-object { padding: 20px; overflow-y: auto; max-height: 60vh; flex-shrink: 0;}
  #panel-empty p { font-size: 14px; color: var(--text-muted); text-align: center; margin: 30px 0; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 8px; }
  .field input[type=color] { width: 100%; height: 40px; border: 1px solid var(--border-color);
    border-radius: 8px; cursor: pointer; padding: 4px; background: var(--bg-panel); }
  .field input[type=number], .field select { width: 100%; padding: 10px 12px; border-radius: 8px; font-size: 14px; outline: none; }
  .field input:focus, .field select:focus { border-color: var(--primary); }
  .field input[type=range] { width: 100%; accent-color: var(--primary); }
  .btn-group { display: flex; gap: 6px; flex-wrap: wrap; }
  .btn-group button { flex: 1; min-width: 44px; padding: 8px; border: 1px solid var(--border-color); border-radius: 8px;
    font-size: 14px; background: var(--bg-panel); color: var(--text-main); font-weight: 500; display: flex; align-items: center; justify-content: center;}
  .btn-group button:hover { background: var(--bg-body); }
  .btn-group button.active { background: rgba(139, 92, 246, 0.1); border-color: var(--primary); color: var(--primary); font-weight: 700; }
  
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border-color); margin-bottom: 20px; }
  .tab { padding: 10px 16px; font-size: 14px; font-weight: 600; color: var(--text-muted); border-bottom: 2px solid transparent; }
  .tab:hover { color: var(--text-main); }
  .tab.active { color: var(--primary); border-bottom-color: var(--primary); }
  .tab-content .field button { padding: 10px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 13px; background: var(--bg-panel); color: var(--text-main); margin: 2px; font-weight: 500; width: calc(50% - 4px);}
  .tab-content .field button:hover { background: var(--bg-body); }
  
  .layers { flex: 1; overflow-y: auto; min-height: 150px; border-top: 1px solid var(--border-color); padding: 16px; background: var(--bg-body); }
  .layers h3 { font-size: 12px; font-weight: 700; color: var(--text-muted); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
  #layer-list { display: flex; flex-direction: column; gap: 6px; }
  .layer-item { display: flex; justify-content: space-between; align-items: center;
    padding: 10px 12px; background: var(--bg-panel); border-radius: 8px; cursor: pointer; font-size: 13px; gap: 8px; border: 1px solid transparent; transition: all 0.2s; }
  .layer-item:hover { border-color: var(--border-color); }
  .layer-item.active { background: rgba(139, 92, 246, 0.08); border-color: var(--primary); }
  .layer-item .layer-label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
  .layer-del { color: var(--text-muted); font-size: 14px; padding: 4px; border-radius: 4px; }
  .layer-del:hover { color: var(--danger); background: rgba(239, 68, 68, 0.1); }

  /* =========================================
     FLOATING TOOLBAR (CHUẨN CANVA)
     ========================================= */
  #floating-toolbar {
    position: fixed; display: none; background: #1e293b; padding: 6px; border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3); z-index: 9999; gap: 2px; align-items: center;
    color: white; transform: translateX(-50%);
    border: 1px solid #334155;
  }
  #floating-toolbar button {
    color: #cbd5e1; font-size: 14px; padding: 8px 10px; border-radius: 6px;
    display: flex; align-items: center; justify-content: center; background: transparent; gap: 4px;
  }
  #floating-toolbar button svg { width: 18px; height: 18px; fill: currentColor; }
  #floating-toolbar button:hover { background: #334155; color: white; }
  #floating-toolbar button#float-delete:hover { background: var(--danger); color: white; }
  #floating-toolbar .divider { width: 1px; height: 20px; background: #475569; margin: 0 4px; }
  #floating-toolbar input[type=color] { width: 24px; height: 24px; padding: 0; border: none; border-radius: 4px; cursor: pointer; background: transparent;}

  /* Toast */
  .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    background: #1f2937; color: #fff; padding: 12px 24px; border-radius: 30px;
    font-size: 14px; font-weight: 500; z-index: 10000; box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1); max-width: 90vw; pointer-events: none; text-align: center; }
  .toast.error { background: var(--danger); }
  .toast.success { background: var(--success); }
  @keyframes slideUp { from { opacity: 0; transform: translate(-50%, 20px); } to { opacity: 1; transform: translate(-50%, 0); } }

  #btn-toggle-panel { display: none; background: var(--bg-body) !important; color: var(--text-main) !important; border: 1px solid var(--border-color); }

  /* ==========================================
     RESPONSIVE MOBILE (TỐI ƯU CHUẨN APP)
     ========================================== */
  @media (max-width: 768px) {
    /* Dashboard Mobile */
    #screen-dashboard header { flex-direction: column; align-items: stretch; padding: 16px; gap: 12px; }
    .header-right { justify-content: space-between; }
    #user-email { max-width: 140px; font-size: 12px; }
    #dashboard-main { padding: 16px; }
    #project-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
    .project-card .info { padding: 12px; }
    .project-card .name { font-size: 14px; }

    /* Workspace Header Mobile */
    .workspace-header { flex-wrap: wrap; padding: 8px 12px; gap: 8px; min-height: auto; }
    .workspace-header .left { width: 100%; justify-content: space-between; }
    #project-name-input { flex: 1; width: auto; font-size: 14px; text-align: center; }
    #save-status { position: absolute; top: 12px; right: 60px; font-size: 11px; }
    
    .workspace-header .center { width: 100%; justify-content: space-between; background: var(--bg-body); border-radius: 8px; padding: 4px; margin-top: 4px; }
    .workspace-header .center button { padding: 6px 12px; font-size: 15px; }
    .workspace-header .center .sep { display: none; }
    #btn-fit { font-size: 12px; padding: 6px 8px; }
    
    .workspace-header .right { width: 100%; justify-content: space-between; gap: 8px; margin-top: 4px;}
    #btn-save { flex: 1; padding: 8px 10px !important; font-size: 14px; border-radius: 8px; }
    .dropdown { display: none; } /* Ẩn bớt tải xuống trên mobile cho gọn, hoặc đưa vào menu 3 chấm */
    #btn-toggle-panel { flex: 1; display: flex; justify-content: center; padding: 8px 10px !important; background: var(--primary) !important; color: #fff !important; border: none; font-weight: 600; border-radius: 8px; }

    /* Workspace Main */
    .workspace-main { flex-direction: column; }
    
    /* Bottom Toolbar (Giống App Canva) */
    .left-tools { 
      width: 100%; height: auto; flex-direction: row; border-right: none; 
      border-top: 1px solid var(--border-color); padding: 8px 12px; overflow-x: auto; justify-content: flex-start; 
      gap: 12px; flex-shrink: 0; z-index: 20;
      padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
      scrollbar-width: none; background: var(--bg-panel);
    }
    .left-tools::-webkit-scrollbar { display: none; }
    .left-tools button { 
      width: 64px; height: 56px; flex-shrink: 0; font-size: 20px; 
      background: transparent; border-radius: 12px; flex-direction: column; gap: 4px;
    }
    .left-tools button svg { width: 22px; height: 22px; }
    .left-tools button span { font-size: 11px; font-weight: 500; }
    .left-tools button:active { background: var(--bg-body); }
    
    .canvas-area { flex: 1; min-height: 0; }
    #canvas-inner { padding: 15px; }

    /* Right Panel (Slide out) */
    .right-panel {
      position: absolute; right: -100%; top: 0; bottom: 0;
      width: 85vw; max-width: 340px;
      transition: right 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: -10px 0 30px rgba(0,0,0,0.15);
      z-index: 50;
    }
    .right-panel.open { right: 0; }
    
    .panel-mobile-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px; border-bottom: 1px solid var(--border-color); font-weight: 700; font-size: 16px;
      background: var(--bg-panel); color: var(--text-main);
    }
    #btn-close-panel { font-size: 20px; color: var(--text-muted); padding: 4px 8px; background: var(--bg-body); border-radius: 50%; }
    #panel-empty, #panel-object { max-height: calc(100vh - 180px); }
  }
</style>
</head>
<body>

<!-- Loading -->
<div id="screen-loading" class="screen">Đang tải không gian làm việc...</div>

<!-- Auth -->
<div id="screen-auth" class="screen hidden">
  <div class="auth-card">
    <h1>Netizen Editor</h1>
    <p class="sub">Đăng nhập bằng email để bắt đầu thiết kế</p>
    <label>Email của bạn</label>
    <input type="email" id="auth-email" placeholder="ban@example.com" autocomplete="email">

<script>
/* ============================================================
   THAY THÔNG TIN SUPABASE CỦA BẠN
   ============================================================ */
const SUPABASE_URL = 'https://hltrwkihjihjfkweinqo.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_TQCg1LvbYL4A5OhVC3krGw_zDoaayCJ';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

fabric.Object.prototype.objectCaching = false;

/* ============================================================
   STATE
   ============================================================ */
const STORAGE_BUCKET = 'design-assets';
const ADMIN_EMAIL = 'icloud.ngdachao@gmail.com';

const SIZE_PRESETS = [
  { name: 'Instagram Post', w: 1080, h: 1080 },
  { name: 'Instagram Story', w: 1080, h: 1920 },
  { name: 'Facebook Post', w: 1200, h: 630 },
  { name: 'Slide 16:9', w: 1920, h: 1080 },
  { name: 'A4 dọc', w: 794, h: 1123 },
  { name: 'Poster A3', w: 1123, h: 1587 },
  { name: 'YouTube Thumb', w: 1280, h: 720 },
  { name: 'Twitter Post', w: 1024, h: 512 },
  { name: 'BiA', w: 828, h: 1792, template: 'bia-template' },
  { name: 'BiV', w: 1080, h: 2400, template: 'biv-template' }
];

let currentUser = null;
let projects = [];
let currentProject = null;
let canvas = null;
let history = [];
let historyIndex = -1;
let isRestoring = false;
let currentZoom = 1;
let dirty = false;
let saveTimer = null;

const $ = (id) => document.getElementById(id);
const uid = () => crypto.randomUUID();

/* ============================================================
   UTILS
============================================================ */
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function sanitizeFilename(s) {
  return (s || 'design').normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^\w\- ]/g, '').trim() || 'design';
}
function toast(msg, type = '') {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}
function hideAll() {
  document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
}

/* ============================================================
   MOBILE PANEL TOGGLE
============================================================ */
$('btn-toggle-panel').addEventListener('click', () => {
  $('right-panel').classList.add('open');
});
$('btn-close-panel').addEventListener('click', () => {
  $('right-panel').classList.remove('open');
});

/* ============================================================
   AUTH
============================================================ */
$('btn-send-link').addEventListener('click', async () => {
  const email = $('auth-email').value.trim();
  const msg = $('auth-msg');
  if (!email) { msg.textContent = 'Vui lòng nhập email'; msg.className = 'error'; return; }

  $('btn-send-link').disabled = true;
  msg.textContent = 'Đang gửi...';
  msg.className = '';

  const { error } = await sb.auth.signInWithOtp({
    email,
    options: { emailRedirectTo: window.location.origin + window.location.pathname }
  });

  $('btn-send-link').disabled = false;

  if (error) {
    msg.textContent = 'Lỗi: ' + error.message;
    msg.className = 'error';
  } else {
    msg.textContent = '✓ Đã gửi! Vui lòng kiểm tra Email (cả mục Spam).';
    msg.className = '';
  }
});

$('auth-email').addEventListener('keydown', e => {
  if (e.key === 'Enter') $('btn-send-link').click();
});

$('btn-logout').addEventListener('click', async () => {
  if (canvas && currentProject) await saveCurrentProject(true);
  if (dirty && !confirm('Có thay đổi chưa lưu. Đăng xuất vẫn tiếp tục?')) return;
  await sb.auth.signOut();
});

sb.auth.onAuthStateChange((event, session) => {
  currentUser = session?.user ?? null;
  $('screen-loading').classList.add('hidden');

  if (currentUser) {
    if (event === 'INITIAL_SESSION' || event === 'SIGNED_IN') {
      $('user-email').textContent = currentUser.email || '';
      $('user-email').title = currentUser.email || '';
      
      if (currentUser.email === ADMIN_EMAIL) {
        $('btn-save-template').classList.remove('hidden');
      } else {
        $('btn-save-template').classList.add('hidden');
      }
      
      showDashboard();
    }
  } else {
    if (event === 'INITIAL_SESSION' || event === 'SIGNED_OUT') {
      if (canvas) { canvas.dispose(); canvas = null; }
      currentProject = null;
      hideAll();
      $('screen-auth').classList.remove('hidden');
    }
  }
});

/* ============================================================
   DASHBOARD
============================================================ */
async function showDashboard() {
  hideAll();
  $('screen-dashboard').classList.remove('hidden');
  await loadProjects();
}

async function loadProjects() {
  $('loading-state').classList.remove('hidden');
  $('project-grid').innerHTML = '';
  $('empty-state').classList.add('hidden');

  const { data, error } = await sb
    .from('projects')
    .select('id, name, width, height, background, updated_at')
    .order('updated_at', { ascending: false });

  $('loading-state').classList.add('hidden');

  if (error) {
    toast('Lỗi tải dự án: ' + error.message, 'error');
    return;
  }
  projects = data || [];
  renderDashboard();
}

function renderDashboard() {
  const grid = $('project-grid'), empty = $('empty-state');
  grid.innerHTML = '';

  if (!projects.length) { empty.classList.remove('hidden'); return; }
  empty.classList.add('hidden');

  projects.forEach(p => {
    const card = document.createElement('div');
    card.className = 'project-card';
    const bg = p.background || '#e5e7eb';
    
    card.innerHTML = `
      <div class="thumb" style="background:linear-gradient(135deg, ${bg} 0%, #cbd5e1 100%)">
        <span style="text-shadow: 0 2px 4px rgba(0,0,0,0.2); color: #fff;">${escapeHtml((p.name || '?')[0].toUpperCase())}</span>
      </div>
      <div class="info">
        <div class="name">${escapeHtml(p.name)}</div>
        <div class="meta">${p.width} × ${p.height} px</div>
      </div>
      <button class="delete-btn" title="Xóa">✕</button>`;

    card.addEventListener('click', (e) => {
      if (e.target.classList.contains('delete-btn')) return;
      openProject(p.id);
    });
    card.querySelector('.delete-btn').addEventListener('click', async (e) => {
      e.stopPropagation();
      if (!confirm(`Xóa dự án "${p.name}"?`)) return;
      const { error } = await sb.from('projects').delete().eq('id', p.id);
      if (error) { toast('Lỗi: ' + error.message, 'error'); return; }
      toast('Đã xóa', 'success');
      await loadProjects();
    });
    grid.appendChild(card);
  });
}

/* ============================================================
   NEW PROJECT MODAL
============================================================ */
$('btn-new-project').addEventListener('click', () => {
  $('modal-new').classList.remove('hidden');
  $('new-name').value = '';
  $('new-name').focus();

  const presets = $('size-presets');
  presets.innerHTML = '';
  SIZE_PRESETS.forEach((s, i) => {
    const aspect = s.w / s.h;
    let pw, ph;
    if (aspect >= 1) { pw = 60; ph = 60 / aspect; } else { ph = 60; pw = 60 * aspect; }
    const btn = document.createElement('button');
    btn.className = 'size-btn';
    btn.innerHTML = `<div class="preview" style="width:${pw}px;height:${ph}px"></div>

/* ============================================================
   CANVAS & SMART GUIDES
============================================================ */
function initCanvas(project) {
  const el = $('c');
  el.width = project.width;
  el.height = project.height;

  canvas = new fabric.Canvas('c', {
    width: project.width,
    height: project.height,
    backgroundColor: project.background || '#ffffff',
    preserveObjectStacking: true,
    selection: true,
    enableRetinaScaling: false
  });
  
  enableSmartGuides(canvas);

  history = []; historyIndex = -1;
  isRestoring = true;

  if (project.data) {
    canvas.loadFromJSON(project.data, () => {
      const loadPromises = [];

      if (canvas.backgroundImage) {
        loadPromises.push(new Promise(resolve => {
          const bgSrc = canvas.backgroundImage.getSrc();
          if (!bgSrc) return resolve();
          canvas.backgroundImage.setSrc(bgSrc, () => resolve(), { crossOrigin: 'anonymous' });
        }));
      }

      canvas.getObjects().forEach(obj => {
        if (obj.type === 'image') {
          const imgSrc = obj.getSrc();
          if (imgSrc) {
            const savedAngle = obj.angle, savedScaleX = obj.scaleX, savedScaleY = obj.scaleY, savedLeft = obj.left, savedTop = obj.top;
            loadPromises.push(new Promise(resolve => {
              obj.setSrc(imgSrc, () => {
                obj.set({ angle: savedAngle, scaleX: savedScaleX, scaleY: savedScaleY, left: savedLeft, top: savedTop });
                obj.setCoords();
                resolve();
              }, { crossOrigin: 'anonymous' });
            }));
          }
        }
      });

      Promise.all(loadPromises).then(() => {
        canvas.calcOffset();
        canvas.renderAll();
        isRestoring = false;
        saveHistory(); refreshLayers(); updateObjectPanel();
        updateFloatingToolbar();
        setTimeout(fitToScreen, 200); 
      });
    });
  } else {
    isRestoring = false;
    if (project.name.includes('Bi') || (project.width === 828 && project.height === 1792 && project.name.includes('A'))) {
      applyTikTokTemplate();
    } else {
      saveHistory();
    }
    setTimeout(fitToScreen, 200);
  }

  canvas.on('selection:created', () => { updateObjectPanel(); refreshLayers(); updateFloatingToolbar(); });
  canvas.on('selection:updated', () => { updateObjectPanel(); refreshLayers(); updateFloatingToolbar(); });
  canvas.on('selection:cleared', () => { updateObjectPanel(); refreshLayers(); $('floating-toolbar').classList.add('hidden'); });
  
  canvas.on('object:moving', updateFloatingToolbar);
  canvas.on('object:scaling', updateFloatingToolbar);
  canvas.on('object:rotating', updateFloatingToolbar);
  canvas.on('object:modified', () => {
    if (!isRestoring) { saveHistory(); markUnsaved(); }
    updateObjectPanel();
    updateFloatingToolbar();
  });
  
  $('canvas-scroll').addEventListener('scroll', updateFloatingToolbar);

  canvas.on('mouse:wheel', function(opt) {
    var delta = opt.e.deltaY;
    var zoom = canvas.getZoom();
    zoom *= 0.999 ** delta;
    if (zoom > 4) zoom = 4;
    if (zoom < 0.05) zoom = 0.05;
    canvas.zoomToPoint({ x: opt.e.offsetX, y: opt.e.offsetY }, zoom);
    currentZoom = zoom;
    $('zoom-label').textContent = Math.round(zoom * 100) + '%';
    updateFloatingToolbar();
    opt.e.preventDefault();
    opt.e.stopPropagation();
  });

  // Sự kiện double click để tách nhóm (ĐÃ SỬA LỖI NULL)
  canvas.on('mouse:dblclick', (e) => {
    const obj = e.target;
    if (obj && obj.type === 'group') {
      obj.toActiveSelection();
      canvas.requestRenderAll();
      toast('Đã tách nhóm!', 'success');
      updateFloatingToolbar();
    }
  });
}

function enableSmartGuides(c) {
  const ctx = c.contextTop;
  let lines = [];
  const snapThreshold = 8;

  c.on('object:moving', function(e) {
    const obj = e.target;
    if (!obj) return;
    c.clearContext(c.contextTop);
    lines = [];

    const zoom = c.getZoom();
    const canvasW = currentProject ? currentProject.width : c.width / zoom;
    const canvasH = currentProject ? currentProject.height : c.height / zoom;

    const objBox = obj.getBoundingRect();
    let targetsX = [0, canvasW / 2, canvasW];
    let targetsY = [0, canvasH / 2, canvasH];

    c.getObjects().forEach(o => {
      if (o === obj || o.type === 'activeSelection') return;
      const b = o.getBoundingRect();
      targetsX.push(b.left, b.left + b.width / 2, b.left + b.width);
      targetsY.push(b.top, b.top + b.height / 2, b.top + b.height);
    });

    const objXPoints = [objBox.left, objBox.left + objBox.width / 2, objBox.left + objBox.width];
    const objYPoints = [objBox.top, objBox.top + objBox.height / 2, objBox.top + objBox.height];

    let bestSnapX = { dist: snapThreshold / zoom, target: null, objPoint: null };
    let bestSnapY = { dist: snapThreshold / zoom, target: null, objPoint: null };

    for (let i = 0; i < objXPoints.length; i++) {
      for (let j = 0; j < targetsX.length; j++) {
        const dist = Math.abs(objXPoints[i] - targetsX[j]);
        if (dist < bestSnapX.dist) bestSnapX = { dist, target: targetsX[j], objPoint: objXPoints[i] };
      }
    }
    for (let i = 0; i < objYPoints.length; i++) {
      for (let j = 0; j < targetsY.length; j++) {
        const dist = Math.abs(objYPoints[i] - targetsY[j]);
        if (dist < bestSnapY.dist) bestSnapY = { dist, target: targetsY[j], objPoint: objYPoints[i] };
      }
    }

    if (bestSnapX.target !== null) {
      obj.left += (bestSnapX.target - bestSnapX.objPoint);
      lines.push({ x1: bestSnapX.target, y1: 0, x2: bestSnapX.target, y2: canvasH, type: 'v' });
    }
    if (bestSnapY.target !== null) {
      obj.top += (bestSnapY.target - bestSnapY.objPoint);
      lines.push({ x1: 0, y1: bestSnapY.target, x2: canvasW, y2: bestSnapY.target, type: 'h' });
    }
    if (bestSnapX.target !== null || bestSnapY.target !== null) obj.setCoords();
  });

  c.on('mouse:up', function() {
    lines = [];
    c.clearContext(c.contextTop);
    c.requestRenderAll();
  });

  c.on('after:render', function() {
    if (lines.length > 0) {
      ctx.save();
      const zoom = c.getZoom();
      lines.forEach(line => {
        ctx.beginPath();
        if (line.type === 'v') {
          ctx.moveTo(line.x1 * zoom, 0);
          ctx.lineTo(line.x1 * zoom, c.getHeight());
        } else {
          ctx.moveTo(0, line.y1 * zoom);
          ctx.lineTo(c.getWidth(), line.y1 * zoom);
        }
        ctx.strokeStyle = '#8b5cf6'; 
        ctx.lineWidth = 1.5; 
        ctx.setLineDash([6, 4]); 
        ctx.stroke();
      });
      ctx.restore();
    }
  });
}

/* ============================================================
   FLOATING TOOLBAR LOGIC (CHUẨN CANVA)
============================================================ */
const floatingToolbar = $('floating-toolbar');

function updateFloatingToolbar() {
  if (!canvas) return;
  const activeObj = canvas.getActiveObject();
  if (!activeObj || activeObj.isEditing) {
    floatingToolbar.classList.add('hidden');
    return;
  }

  const coords = activeObj.oCoords.mt; // Middle Top
  const canvasRect = canvas.upperCanvasEl.getBoundingClientRect();

  let left = canvasRect.left + coords.x;
  let top = canvasRect.top + coords.y - 55; // Cách 55px lên trên

  // Nếu object ở quá cao, đặt thanh toolbar xuống dưới
  if (top < 60) {
    const bottomCoords = activeObj.oCoords.mb; // Middle Bottom
    top = canvasRect.top + bottomCoords.y + 10;
  }

  floatingToolbar.style.left = `${left}px`;
  floatingToolbar.style.top = `${top}px`;
  floatingToolbar.classList.remove('hidden');
  
  // Cập nhật icon khóa
  const isLocked = activeObj.lockMovementX;
  if (isLocked) {
    $('icon-lock').classList.add('hidden');
    $('icon-unlock').classList.remove('hidden');
    $('float-lock').title = 'Mở khóa';
  } else {
    $('icon-lock').classList.remove('hidden');
    $('icon-unlock').classList.add('hidden');
    $('float-lock').title = 'Khóa';
  }

  // Hiển thị các thuộc tính riêng biệt
  const isText = ['textbox','i-text','text'].includes(activeObj.type);
  const isImage = activeObj.type === 'image';
  
  if (isText) {
    $('float-text-controls').classList.remove('hidden');
    $('float-shape-controls').classList.add('hidden');
    $('float-font').value = activeObj.fontFamily || 'Inter';
    $('float-font-size').value = activeObj.fontSize || 32;
    $('float-color').value = normalizeColor(activeObj.fill || '#000000');
    $('float-bold').style.color = activeObj.fontWeight === 'bold' ? 'var(--primary)' : '#cbd5e1';
    $('float-italic').style.color = activeObj.fontStyle === 'italic' ? 'var(--primary)' : '#cbd5e1';
    $('float-underline').style.color = activeObj.underline ? 'var(--primary)' : '#cbd5e1';
  } else {
    $('float-text-controls').classList.add('hidden');
    if (isImage) {
      $('float-shape-controls').classList.add('hidden');
    } else {
      $('float-shape-controls').classList.remove('hidden');
      $('float-shape-color').value = normalizeColor(activeObj.fill || '#000000');
    }
  }
}

function saveHistory() {
  if (isRestoring || !canvas) return;
  const json = canvas.toJSON(['id', 'name']);
  if (historyIndex >= 0) {
    if (JSON.stringify(history[historyIndex]) === JSON.stringify(json)) return;
  }
  history = history.slice(0, historyIndex + 1);
  history.push(json);
  if (history.length > 60) history.shift();
  historyIndex = history.length - 1;
  updateUndoRedo();
}
function undo() { if (historyIndex <= 0) return; historyIndex--; restoreHistory(); }
function redo() { if (historyIndex >= history.length - 1) return; historyIndex++; restoreHistory(); }
function restoreHistory() {
  isRestoring = true;
  canvas.loadFromJSON(history[historyIndex], () => {
    canvas.renderAll();
    isRestoring = false;
    updateUndoRedo(); updateObjectPanel(); refreshLayers(); markUnsaved(); updateFloatingToolbar();
  });
}
function updateUndoRedo() {
  $('btn-undo').disabled = historyIndex <= 0;
  $('btn-redo').disabled = historyIndex >= history.length - 1;
}

function markUnsaved() {
  dirty = true;
  $('save-status').textContent = 'Chưa lưu...';
  $('save-status').style.display = 'inline';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => saveCurrentProject(true), 2000);
}

async function saveCurrentProject(silent = false) {
  if (!currentProject || !canvas) return;
  clearTimeout(saveTimer);
  const json = canvas.toJSON(['id', 'name']);
  const name = $('project-name-input').value.trim() || currentProject.name;
  const background = (typeof canvas.backgroundColor === 'string') ? canvas.backgroundColor : '#ffffff';
  $('save-status').textContent = 'Đang lưu...';
  $('save-status').style.display = 'inline';

  const { error } = await sb.from('projects').update({ name, background, data: json, updated_at: new Date().toISOString() }).eq('id', currentProject.id);
  if (error) {
    $('save-status').textContent = 'Lỗi lưu';
    if (!silent) toast('Lỗi lưu: ' + error.message, 'error');
    return;
  }
  currentProject.name = name; currentProject.background = background; dirty = false;
  $('save-status').textContent = 'Đã lưu ✓';
  setTimeout(() => { if (!dirty) { $('save-status').textContent = ''; $('save-status').style.display = 'none'; } }, 1500);
}

$('btn-save').addEventListener('click', () => saveCurrentProject(false));
$('project-name-input').addEventListener('input', () => markUnsaved());

function applyZoom(z) {
  if (!canvas || !currentProject) return;
  currentZoom = Math.max(0.05, Math.min(4, z));
  canvas.setZoom(currentZoom);
  canvas.setDimensions({ width: currentProject.width * currentZoom, height: currentProject.height * currentZoom }); 
  canvas.renderAll();
  $('zoom-label').textContent = Math.round(currentZoom * 100) + '%';
  updateFloatingToolbar();
}
function fitToScreen() {
  if (!canvas || !currentProject) return;
  const scroll = $('canvas-scroll');
  const aw = scroll.clientWidth - 40, ah = scroll.clientHeight - 40;
  if (aw <= 0 || ah <= 0) return;
  applyZoom(Math.min(aw / currentProject.width, ah / currentProject.height, 1));
}
$('btn-zoom-in').addEventListener('click', () => applyZoom(currentZoom * 1.15));
$('btn-zoom-out').addEventListener('click', () => applyZoom(currentZoom / 1.15));
$('btn-fit').addEventListener('click', fitToScreen);
$('btn-undo').addEventListener('click', undo);
$('btn-redo').addEventListener('click', redo);

function addText() {
  const t = new fabric.Textbox('Nhập văn bản', {
    left: canvas.getWidth() / 2, top: canvas.getHeight() / 2, originX: 'center', originY: 'center',
    fontSize: 40, fontFamily: 'Inter', fill: '#1f2937', width: 400, textAlign: 'center', splitByGrapheme: true
  });
  canvas.add(t); canvas.setActiveObject(t); canvas.renderAll();
  saveHistory(); markUnsaved(); updateFloatingToolbar();
}

function getStarPoints(spikes, outerR, innerR) {
  const pts = [];
  for (let i = 0; i < spikes * 2; i++) {
    const r = i % 2 === 0 ? outerR : innerR;
    const a = (Math.PI / spikes) * i - Math.PI / 2;
    pts.push({ x: Math.cos(a) * r, y: Math.sin(a) * r });
  }
  return pts;
}

function addShape(type) {
  const cx = canvas.getWidth() / 2, cy = canvas.getHeight() / 2;
  const opts = { left: cx, top: cy, originX: 'center', originY: 'center', fill: '#8b5cf6' };
  let shape;
  if (type === 'rect') shape = new fabric.Rect({ ...opts, width: 240, height: 160 });
  else if (type === 'circle') shape = new fabric.Circle({ ...opts, radius: 110 });
  else if (type === 'triangle') shape = new fabric.Triangle({ ...opts, width: 200, height: 180 });
  else if (type === 'star') shape = new fabric.Polygon(getStarPoints(5, 110, 48), { ...opts });
  else if (type === 'line') shape = new fabric.Line([cx - 120, cy, cx + 120, cy], { stroke: '#1f2937', strokeWidth: 4 });
  if (shape) { 
    canvas.add(shape); canvas.setActiveObject(shape); canvas.renderAll(); 
    saveHistory(); markUnsaved(); updateFloatingToolbar(); 
  }
}

function addStatusBar() {
  const scale = 2; 
  const s1 = new fabric.Rect({ width: 4*scale, height: 8*scale, fill: '#333', rx: 1, ry: 1, left: 0, top: 12*scale });
  const s2 = new fabric.Rect({ width: 4*scale, height: 12*scale, fill: '#333', rx: 1, ry: 1, left: 6*scale, top: 8*scale });
  const s3 = new fabric.Rect({ width: 4*scale, height: 16*scale, fill: '#333', rx: 1, ry: 1, left: 12*scale, top: 4*scale });
  const s4 = new fabric.Rect({ width: 4*scale, height: 20*scale, fill: '#333', rx: 1, ry: 1, left: 18*scale, top: 0 });
  const signalGroup = new fabric.Group([s1, s2, s3, s4], { left: 0, top: 0 });

  const wifiPath = "M12 21a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm-2.8-7.2c1.6-1.2 4-1.2 5.6 0l1.6-1.6a8 8 0 0 0-8.8 0l1.6 1.6zm-3.2-3.2c3.2-2.4 8-2.4 11.2 0l1.6-1.6a12 12 0 0 0-14.4 0l1.6 1.6z";
  const wifiObj = new fabric.Path(wifiPath, { fill: '#333', left: 35*scale, top: 2*scale, scaleX: scale*0.7, scaleY: scale*0.7 });

  const batBody = new fabric.Rect({ width: 24*scale, height: 12*scale, fill: 'transparent', stroke: '#333', strokeWidth: 2*scale, rx: 3*scale, ry: 3*scale, left: 75*scale, top: 4*scale });
  const batTip = new fabric.Rect({ width: 2*scale, height: 4*scale, fill: '#333', rx: 1, ry: 1, left: 100*scale, top: 8*scale });
  const batLevel = new fabric.Rect({ width: 16*scale, height: 6*scale, fill: '#333', rx: 1, ry: 1, left: 78*scale, top: 7*scale }); 
  const batText = new fabric.Textbox('7', { fontSize: 12*scale, fontFamily: 'Inter', fill: '#333', left: 83*scale, top: 5*scale, width: 20*scale, textAlign: 'center', fontWeight: 'bold' });

  const statusGroup = new fabric.Group([signalGroup, wifiObj, batBody, batTip, batLevel, batText], {
    left: canvas.getWidth() / 2, top: canvas.getHeight() / 2, originX: 'center', originY: 'center', name: 'Thanh trạng thái'
  });
  canvas.add(statusGroup); canvas.setActiveObject(statusGroup); canvas.renderAll();
  saveHistory(); markUnsaved(); updateFloatingToolbar();
}

// FIX LỖI CLICK NÚT TOOL TRÊN MOBILE
document.querySelectorAll('.left-tools button').forEach(b => {
  b.addEventListener('click', (e) => {
    e.preventDefault(); // Ngăn chặn sự kiện mặc định
    const btn = e.target.closest('button'); // Đảm bảo lấy đúng thẻ button dù click vào svg
    if (!btn) return;

    document.querySelectorAll('.left-tools button').forEach(x => x.classList.remove('active'));
    btn.classList.add('active');
    setTimeout(() => btn.classList.remove('active'), 300); 

    const t = btn.dataset.tool;
    if (t === 'text') addText();
    else if (t === 'image') $('file-image').click();
    else if (t === 'statusbar') addStatusBar();
    else addShape(t);
  });
});

$('file-image').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  const uploadBtn = document.querySelector('.left-tools button[data-tool="image"]');
  uploadBtn.style.opacity = '0.5';
  toast('Đang tải ảnh lên...');
  try {
    const publicUrl = await uploadImageToStorage(file);
    await addImageToCanvas(publicUrl);
    toast('Đã thêm ảnh', 'success');
  } catch (err) {
    toast('Lỗi upload: ' + err.message, 'error');
  } finally {
    uploadBtn.style.opacity = '1';
  }
});

async function uploadImageToStorage(file) {
  if (file.size > 5 * 1024 * 1024) throw new Error('Ảnh quá lớn (giới hạn 5MB)');
  const ext = (file.name.split('.').pop() || 'png').toLowerCase();
  const path = `${currentUser.id}/${uid()}.${ext}`;
  const { error } = await sb.storage.from(STORAGE_BUCKET).upload(path, file, { contentType: file.type, upsert: false });
  if (error) throw error;
  const { data } = sb.storage.from(STORAGE_BUCKET).getPublicUrl(path);
  return data.publicUrl;
}

function addImageToCanvas(url) {
  return new Promise((resolve, reject) => {
    fabric.Image.fromURL(url, (img) => {
      if (!img.width || !img.height) { reject(new Error('Ảnh không hợp lệ')); return; }
      const maxW = canvas.getWidth() * 0.6, maxH = canvas.getHeight() * 0.6;
      const s = Math.min(maxW / img.width, maxH / img.height, 1);
      img.set({ scaleX: s, scaleY: s, left: canvas.getWidth() / 2, top: canvas.getHeight() / 2, originX: 'center', originY: 'center' });
      canvas.add(img); canvas.setActiveObject(img); canvas.renderAll(); 
      saveHistory(); markUnsaved(); updateFloatingToolbar();
      resolve();
    }, { crossOrigin: 'anonymous' });
  });
}

function normalizeColor(c) {
  if (typeof c !== 'string') return '#000000';
  if (/^#[0-9a-f]{6}$/i.test(c)) return c;
  if (/^#[0-9a-f]{3}$/i.test(c)) return '#' + c[1]+c[1]+c[2]+c[2]+c[3]+c[3];
  return '#000000';
}

function updateObjectPanel() {
  if (!canvas) return;
  const obj = canvas.getActiveObject();
  const pEmpty = $('panel-empty'), pObj = $('panel-object');
  if (!obj || obj.type === 'activeSelection') {
    pEmpty.style.display = 'block'; pObj.classList.add('hidden'); return;
  }
  pEmpty.style.display = 'none'; pObj.classList.remove('hidden');

  const isText = ['textbox','i-text','text'].includes(obj.type);
  $('text-fields').style.display = isText ? 'block' : 'none';
  $('field-color').style.display = isText ? 'none' : 'block';
  $('obj-color').value = normalizeColor(obj.fill || '#000000');

  if (isText) {
    $('font-family').value = obj.fontFamily || 'Inter';
    $('font-size').value = obj.fontSize || 32;
    $('btn-bold').classList.toggle('active', obj.fontWeight === 'bold');
    $('btn-italic').classList.toggle('active', obj.fontStyle === 'italic');
    $('btn-underline').classList.toggle('active', !!obj.underline);
    document.querySelectorAll('[data-align]').forEach(b =>
      b.classList.toggle('active', obj.textAlign === b.dataset.align));
  }
  const op = Math.round((obj.opacity ?? 1) * 100);
  $('obj-opacity').value = op; $('opacity-val').textContent = op;
  $('pos-x').value = Math.round(obj.left || 0);
  $('pos-y').value = Math.round(obj.top || 0);
  $('pos-w').value = Math.round((obj.width || 0) * (obj.scaleX || 1));
  $('pos-h').value = Math.round((obj.height || 0) * (obj.scaleY || 1));
  $('pos-angle').value = Math.round(obj.angle || 0);
}

const getActive = () => canvas && canvas.getActiveObject();
const refresh = () => { if (canvas) { canvas.renderAll(); saveHistory(); markUnsaved(); updateObjectPanel(); updateFloatingToolbar(); } };

$('bg-color').addEventListener('input', (e) => {
  if (!canvas) return;
  canvas.setBackgroundColor(e.target.value, () => canvas.renderAll());
  markUnsaved();
});

document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
    document.querySelector(`[data-tab-content="${t.dataset.tab}"]`).classList.remove('hidden');
  });
});

$('obj-color').addEventListener('input', e => {
  const o = getActive(); if (!o) return;
  o.set('fill', e.target.value); canvas.renderAll();
});
$('obj-color').addEventListener('change', () => { saveHistory(); markUnsaved(); });

$('font-family').addEventListener('change', e => {
  const o = getActive(); if (!o) return;
  o.set('fontFamily', e.target.value);
  if (document.fonts) document.fonts.load(`${o.fontSize || 32}px "${e.target.value}"`);
  refresh();
});
$('font-size').addEventListener('input', e => {
  const o = getActive(); if (!o) return;
  o.set('fontSize', parseInt(e.target.value) || 12); canvas.renderAll();
});
$('font-size').addEventListener('change', () => { saveHistory(); markUnsaved(); });

$('btn-bold').addEventListener('click', () => {
  const o = getActive(); if (!o) return;
  o.set('fontWeight', o.fontWeight === 'bold' ? 'normal' : 'bold'); refresh();
});
$('btn-italic').addEventListener('click', () => {
  const o = getActive(); if (!o) return;
  o.set('fontStyle', o.fontStyle === 'italic' ? 'normal' : 'italic'); refresh();
});
$('btn-underline').addEventListener('click', () => {
  const o = getActive(); if (!o) return;
  o.set('underline', !o.underline); refresh();
});
document.querySelectorAll('[data-align]').forEach(b => {
  b.addEventListener('click', () => {
    const o = getActive(); if (!o) return;
    o.set('textAlign', b.dataset.align); refresh();
  });
});

$('obj-opacity').addEventListener('input', e => {
  const o = getActive(); if (!o) return;
  o.set('opacity', parseInt(e.target.value) / 100);
  $('opacity-val').textContent = e.target.value;
  canvas.renderAll();
});
$('obj-opacity').addEventListener('change', () => { saveHistory(); markUnsaved(); });

$('btn-forward').addEventListener('click', () => { const o = getActive(); if (o) { canvas.bringForward(o); refresh(); }});
$('btn-backward').addEventListener('click', () => { const o = getActive(); if (o) { canvas.sendBackwards(o); refresh(); }});
$('btn-front').addEventListener('click', () => { const o = getActive(); if (o) { canvas.bringToFront(o); refresh(); }});
$('btn-back-layer').addEventListener('click', () => { const o = getActive(); if (o) { canvas.sendToBack(o); refresh(); }});

['pos-x','pos-y','pos-w','pos-h','pos-angle'].forEach(id => {
  $(id).addEventListener('change', e => {
    const o = getActive(); if (!o) return;
    const v = parseFloat(e.target.value) || 0;
    if (id === 'pos-x') o.set('left', v);
    else if (id === 'pos-y') o.set('top', v);
    else if (id === 'pos-w') o.set('scaleX', v / (o.width || 1));
    else if (id === 'pos-h') o.set('scaleY', v / (o.height || 1));
    else if (id === 'pos-angle') o.set('angle', v);
    canvas.renderAll(); saveHistory(); markUnsaved(); updateFloatingToolbar();
  });
});

function refreshLayers() {
  const list = $('layer-list');
  if (!canvas) { list.innerHTML = ''; return; }
  list.innerHTML = '';
  const objects = canvas.getObjects();
  const active = canvas.getActiveObject();
  for (let i = objects.length - 1; i >= 0; i--) {
    const obj = objects[i];
    const div = document.createElement('div');
    div.className = 'layer-item' + (obj === active ? ' active' : '');
    let label = obj.type;
    if (['textbox','i-text','text'].includes(obj.type)) label = (obj.text || 'Text').slice(0, 24) || 'Text';
    else if (obj.type === 'image') label = 'Ảnh';
    else if (obj.type === 'rect') label = 'Hình chữ nhật';
    else if (obj.type === 'circle') label = 'Hình tròn';
    else if (obj.type === 'triangle') label = 'Tam giác';
    else if (obj.type === 'line') label = 'Đường kẻ';
    else if (obj.type === 'polygon') label = 'Đa giác';
    else if (obj.type === 'group') label = obj.name || 'Nhóm';

    div.innerHTML = `<span class="layer-label">${escapeHtml(label)}</span>
      <button class="layer-del" title="Xóa">✕</button>`;
    div.addEventListener('click', (e) => {
      if (e.target.classList.contains('layer-del')) return;
      canvas.setActiveObject(obj); canvas.renderAll();
      updateObjectPanel(); refreshLayers(); updateFloatingToolbar();
    });
    div.querySelector('.layer-del').addEventListener('click', (e) => {
      e.stopPropagation();
      canvas.remove(obj); canvas.renderAll(); saveHistory(); markUnsaved(); updateFloatingToolbar();
    });
    list.appendChild(div);
  }
}

$('btn-download').addEventListener('click', (e) => {
  e.stopPropagation();
  $('download-menu').classList.toggle('hidden');
});
$('btn-more-options').addEventListener('click', (e) => {
  e.stopPropagation();
  $('more-menu').classList.toggle('hidden');
});
document.addEventListener('click', () => {
  $('download-menu').classList.add('hidden');
  $('more-menu').classList.add('hidden');
});

$('download-menu').querySelectorAll('button').forEach(b => {
  b.addEventListener('click', () => {
    downloadImage(b.dataset.format, b.dataset.quality, parseInt(b.dataset.scale));
    $('download-menu').classList.add('hidden');
  });
});

function downloadImage(format, quality, scale) {
  if (!canvas || !currentProject) return;
  try {
    const oldZoom = canvas.getZoom(), oldWidth = canvas.getWidth(), oldHeight = canvas.getHeight();
    canvas.setZoom(1);
    canvas.setDimensions({ width: currentProject.width, height: currentProject.height });
    canvas.renderAll();

    const dataURL = canvas.toDataURL({ format: format === 'jpeg' ? 'jpeg' : 'png', quality: parseFloat(quality) || 1, multiplier: scale });

    canvas.setZoom(oldZoom);
    canvas.setDimensions({ width: oldWidth, height: oldHeight });
    canvas.renderAll();

    const a = document.createElement('a');
    a.download = `${sanitizeFilename(currentProject.name)}.${format}`;
    a.href = dataURL;
    a.click();
    toast('Đã tải xuống', 'success');
  } catch (err) {
    toast('Lỗi xuất ảnh: ' + err.message, 'error');
  }
}

document.addEventListener('keydown', (e) => {
  if (!canvas) return;
  const tag = (e.target.tagName || '').toLowerCase();
  if (['input','textarea','select'].includes(tag) || e.target.isContentEditable) return;
  const active = canvas.getActiveObject();
  if (active && active.isEditing) return;

  if (e.key === 'Delete' || e.key === 'Backspace') {
    if (active) {
      if (active.type === 'activeSelection') {
        active.forEachObject(o => canvas.remove(o));
        canvas.discardActiveObject();
      } else canvas.remove(active);
      canvas.renderAll();
      $('floating-toolbar').classList.add('hidden');
      saveHistory(); markUnsaved(); refreshLayers();
      e.preventDefault();
    }
  } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
    e.preventDefault(); e.shiftKey ? redo() : undo();
  } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') {
    e.preventDefault(); redo();
  } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'd') {
    e.preventDefault(); $('float-duplicate').click();
  } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
    e.preventDefault(); saveCurrentProject(false);
  }
});

window.addEventListener('beforeunload', (e) => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
document.fonts.ready.then(() => { if (canvas) canvas.renderAll(); });

$('btn-save-template').addEventListener('click', async () => {
  if (!currentProject || !canvas) return;
  if (currentUser.email !== ADMIN_EMAIL) { 
    toast('Bạn không có quyền lưu mẫu!', 'error'); return;
  }
  const tplName = prompt('Nhập tên mẫu:', 'TikTok Template');
  if (!tplName) return;
  toast('Đang lưu mẫu...');
  const json = canvas.toJSON(['id', 'name']);
  const { error } = await sb.from('templates').insert({ name: tplName, width: currentProject.width, height: currentProject.height, data: json });
  if (error) toast('Lỗi lưu mẫu: ' + error.message, 'error');
  else toast('Đã lưu mẫu thành công!', 'success');
});

$('btn-delete-project').addEventListener('click', async () => {
  if (!currentProject) return;
  if (!confirm(`Bạn có chắc chắn muốn xóa dự án "${currentProject.name}"?`)) return;
  const { error } = await sb.from('projects').delete().eq('id', currentProject.id);
  if (error) { toast('Lỗi xóa dự án: ' + error.message, 'error'); return; }
  toast('Đã xóa dự án!', 'success');
  currentProject = null;
  backToDashboard();
});

// CẮT ẢNH (CROP)
let isCropping = false, cropOverlay = null, imageToCrop = null;

$('btn-crop').addEventListener('click', () => {
  const o = getActive();
  if (isCropping) {
    isCropping = false;
    $('btn-crop').innerText = '✂️ Cắt Ảnh';
    $('btn-crop').style.background = '#a855f7';
    if (imageToCrop && cropOverlay) {
      cropOverlay.set({ absolutePositioned: false });
      const zoom = canvas.getZoom(), img = imageToCrop, rect = cropOverlay;
      const imgBounds = img.getBoundingRect(), rectBounds = rect.getBoundingRect();
      img.clipPath = new fabric.Rect({
        left: (rectBounds.left - imgBounds.left) / zoom,
        top: (rectBounds.top - imgBounds.top) / zoom,
        width: (rectBounds.width / zoom),
        height: (rectBounds.height / zoom),
        originX: 'left', originY: 'top', absolutePositioned: false
      });
      img.set({ selectable: true, opacity: 1 });
      canvas.remove(cropOverlay);
      canvas.setActiveObject(img);
    }
    canvas.renderAll(); saveHistory(); markUnsaved(); return;
  }
  if (!o || o.type !== 'image') { toast('Vui lòng chọn ảnh!', 'error'); return; }
  isCropping = true; imageToCrop = o;
  $('btn-crop').innerHTML = '✅ Lưu Cắt';
  $('btn-crop').style.background = '#10b981';
  o.set({ selectable: false, opacity: 0.5 });
  cropOverlay = new fabric.Rect({
    left: o.left, top: o.top, width: o.width * o.scaleX, height: o.height * o.scaleY,
    originX: o.originX, originY: o.originY, angle: o.angle,
    fill: 'transparent', stroke: '#a855f7', strokeWidth: 2, strokeDashArray: [5, 5],
    cornerColor: '#a855f7', cornerStyle: 'circle', absolutePositioned: true
  });
  o.set({ clipPath: cropOverlay });
  canvas.add(cropOverlay); canvas.setActiveObject(cropOverlay); canvas.renderAll();
});

canvas.on('object:moving', (e) => {
  if (isCropping && e.target === imageToCrop && cropOverlay) {
    cropOverlay.set({ left: e.target.left, top: e.target.top, angle: e.target.angle });
  }
});
